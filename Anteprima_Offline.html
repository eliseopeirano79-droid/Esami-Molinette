xt":"fra 80 e 60 ml/min","correct":false},{"id":"C","text":"inferiore a 60 ml/min","correct":false},{"id":"D","text":"fra 29 e 15 ml/min","correct":true},{"id":"E","text":"inferiore a 15 ml/min","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::IRC"],"explanation":null},{"id":"anki-1656606079317","subject":"nefro","subject_label":"Nefrologia","topic":"Pielonefrite","type":"multiple_choice","question":"Quale di queste affermazioni in tema di pielonefrite considerate corretta?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"la pielonefrite è un'infezione ascendente localizzata a livello delle cavità pielica","correct":false},{"id":"B","text":"la pielonefrite è un’infezione sempre bilaterale del parenchima renale","correct":false},{"id":"C","text":"la pielonefrite è una nefropatia infettiva tubulo-interstiziale da germi non tubercolari","correct":true},{"id":"D","text":"la pielonefrite è un’infezione tubulo-interstiziale che può essere causata da germi gram-positivi, gram-negativi o tubercolari","correct":false},{"id":"E","text":"la pielonefrite riconosce una patogenesi da deposizione di immunocomplessi","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"le infezioni da bacillo tubercolare danno luogo a un quadro particolare, a sé, che viene designato come tubercolosi del rene","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::pielonefrite"],"explanation":null},{"id":"anki-1656606153758","subject":"nefro","subject_label":"Nefrologia","topic":"Malattia renale cronica","type":"multiple_choice","question":"Nel caso di un paziente con un GFR di 30 ml/min per una insufficienza renale cronica di natura non nota, quale di queste affermazioni giudicate corretta?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"il paziente può fare una TC con mezzo di contrasto iodato","correct":false},{"id":"B","text":"il paziente può eseguire una gammascintigrafia renale senza problemi","correct":false},{"id":"C","text":"il paziente può eseguire una terapia diuretica anche ad alte dosi","correct":false},{"id":"D","text":"nessuna delle precedenti","correct":false},{"id":"E","text":"tutte le precedenti","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"Perchè la A è corretta: Le misure preventive del danno da mdc in presenza di insufficienza renale con GFR < 45 ml/min/1.73m2 sono rappresentate da: idratazione (preferibilmente alcalina ed endovena), utilizzo di mdc a bassa osmolarità, riduzione della dose minima del mdc utilizzato, incremento del tempo tra indagini successive con mdc, e sospensione di farmaci potenzialmente nefrotossici. INVECE per la RM: no mdc <30 ml/min, <60 sì solo se c’è il consenso informato del paziente (la si prende in considerazione soprattutto per cause cerebrali).Ci sono limitazioni per la RM perché l'uso di gadolinio in pazienti con insufficienza renale è stato associato a fibrosi sistemica nefrogenica, rara e grave complicanza. i casi di questa complicanza sono più frequentemente stati associati all'uso di una formulazione di gadolinio lineare e non ionica (gadodiamide), non molto diffusa nella pratica attuale, mentre ora si preferiscono le formulazioni a struttura ciclica caratterizzate da assai minore possibilità di rilasciare ioni liberi di gadolinio ai quali sono imputabili gli effetti tossici. Per la C: in IR si può usare furosemide con possibilità di ricorrere ai dosaggi più elevati del farmaco per prolungarne l' effetto massimo ed aumentarne così l'azione cumulativa: fino a 250 mg ogni 4-6 ore","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::IRC"],"explanation":null},{"id":"anki-1656 n":"La nefropatia interstiziale acuta è una nefropatia causata da:","appelli":["addome::appelli::2026::esonero_nefro_uro"],"answer_status":"single","options":[{"id":"A","text":"diabete mellito di tipo 2","correct":false},{"id":"B","text":"reflusso vescico-ureterale congenito","correct":false},{"id":"C","text":"assunzione prolungata nel tempo di analgesici","correct":false},{"id":"D","text":"agenti infettivi","correct":false},{"id":"E","text":"reazione immunologica acuta causata da fenomeni allergici, di solito ad un farmaco","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::esonero_nefro_uro","addome::nefro::IRA"],"explanation":null},{"id":"anki-1771006038395","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"Qual è la glomerulonefrite primitiva più frequente nell’età adulta che si presenta con un quadro clinico di sindrome nefrosica?","appelli":["addome::appelli::2026::esonero_nefro_uro"],"answer_status":"single","options":[{"id":"A","text":"glomerulosclerosi focale segmentaria","correct":false},{"id":"B","text":"glomerulonefrite membrano proliferativa","correct":false},{"id":"C","text":"minimal change","correct":false},{"id":"D","text":"nefropatia diabetica","correct":false},{"id":"E","text":"glomerulonefrite membranosa","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::esonero_nefro_uro","addome::nefro::GNF"],"explanation":null},{"id":"anki-1771006083247","subject":"nefro","subject_label":"Nefrologia","topic":"Dialisi","type":"multiple_choice","question":"La depurazione dei cataboliti del sangue del paziente uremico mediante l’emodialisi standard avviene principalmente per un meccanismo di:","appelli":["addome::appelli::2026::esonero_nefro_uro"],"answer_status":"single","options":[{"id":"A","text":"osmosi","correct":false},{"id":"B","text":"diffusione e convezione","correct":true},{"id":"C","text":"forma delle molecole","correct":false},{"id":"D","text":"gradiente elettrico","correct":false},{"id":"E","text":"pressione oncotica del sangue","correct":false}],"correct_indexes":[1],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::esonero_nefro_uro","addome::nefro::dialisi"],"explanation":null},{"id":"anki-1771006129054","subject":"nefro","subject_label":"Nefrologia","topic":"Danno renale acuto","type":"multiple_choice","question":"Qual è la più frequente causa di insufficienza renale acuta organica in ambito ospedaliero?","appelli":["addome::appelli::2026::esonero_nefro_uro"],"answer_status":"single","options":[{"id":"A","text":"emolisi intravascolare","correct":false},{"id":"B","text":"le ustioni","correct":false},{"id":"C","text":"la disidratazione","correct":false},{"id":"D","text":"lo shock cardiogeno","correct":false},{"id":"E","text":"iatrogena, da farmaci e mezzo di contrasto","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::esonero_nefro_uro","addome::nefro::IRA"],"explanation":null},{"id":"anki-1771007784705","subject":"nefro","subject_label":"Nefrologia","topic":"Dialisi","type":"multiple_choice","question":"Quale di queste affermazioni riguardo alla dialisi peritoneale ritenete corretta?","appelli":["addome::appelli::2026::aprile","addome::appelli::2026::febbraio_1"],"answer_status":"single","options":[{"id":"A","text":"i pazienti in dialisi peritoneale sono il 50% del totale","correct":false},{"id":"B","text":"il liquido di carico è di solito contenuto in contenitori di vetro sterili","correct":false},{"id":"C","text":"in corso di dialisi peritoneale si usano delle soluzioni ipertoniche","correct":true},{"id":"D","text":"in dialisi peritoneale la sopravvivenza dei pazienti è migliore rispetto all’emodialisi","correct":false},{"id":"E","text":"in corso di dialisi peritoneale gli scambi avvengono solo per convezione","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"aprile 26 la risposta C era \"in corso di dialisi peritoneale si usano delle soluzioni ipertoniche con glucosio ad alte concentrazioni \"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::aprile","addome::appelli::2026::febbraio_1","addome::nefro::dialisi"],"explanation":null},{"id":"anki-1772180893126","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Un paziente di 70 anni, iperteso da 15 anni ed in trattamento farmacologico, con insufficienza renale nota e valori di creatinina sui 2 mg/dl, segnala un incremento ponderale di 3 kg negli ultimi 2 mesi, edemi arti inferiori ingravescenti soprattutto alla sera, bilaterali, spossatezza. Quali esame richiedete in prima battuta con urgenza?","appelli":["addome::appelli::2026::febbraio_2"],"answer_status":"single","options":[{"id":"A","text":"ecodoppler venoso arti inferiori","correct":false},{"id":"B","text":"ecografia renale","correct":false},{"id":"C","text":"esame urine, creatinina, emocromo","correct":true},{"id":"D","text":"elettrocardiogramma","correct":false},{"id":"E","text":"ecocardiografia","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::febbraio_2","addome::nefro::esameurine"],"explanation":null},{"id":"anki-1772181189661","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"La glomerulosclerosi focale segmentaria si presenta comunemente con","appelli":["addome::appelli::2026::febbraio_2"],"answer_status":"single","options":[{"id":"A","text":"danno renale acuto","correct":false},{"id":"B","text":"sindrome nefritica","correct":false},{"id":"C","text":"infezione delle vie urinarie","correct":false},{"id":"D","text":"anomalia urinaria isolata","correct":false},{"id":"E","text":"proteinuria di diverso grado","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::febbraio_2","addome::nefro::GNF"],"explanation":null},{"id":"anki-1772182255570","subject":"nefro","subject_label":"Nefrologia","topic":"Dialisi","type":"multiple_choice","question":"La percentuale dei pazienti in dialisi peritoneale in Italia sul totale dei pazienti dializzati","appelli":["addome::appelli::2026::febbraio_2"],"answer_status":"single","options":[{"id":"A","text":"è inferiore rispetto a quella dei pazienti in emodialisi","correct":true},{"id":"B","text":"è maggiore rispetto a quella dei pazienti in emodialisi","correct":false},{"id":"C","text":"è inferiore rispetto a quella dei pazienti in emodialisi, ma solo nelle regioni con alta densità abitativa","correct":false},{"id":"D","text":"è inferiore rispetto a quella dei pazienti in emodialisi, ma solo nelle regioni con bassa densità abitativa","correct":false},{"id":"E","text":"è sostanzialmente sovrapponibile a quella dei pazienti in emodialisi","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::febbraio_2","addome::nefro::dialisi"],"explanation":null},{"id":"anki-1776950827603","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"In un paziente con diagnosi di GN membranosa severa, con proteinuria > 5 g/die, quale alterazione tra le seguenti vi aspettereste?","appelli":["addome::appelli::2026::aprile"],"answer_status":"single","options":[{"id":"A","text":"elevati trigliceridi","correct":true},{"id":"B","text":"tendenza ad una diatesi emorragica","correct":false},{"id":"C","text":"Ig di norma","correct":false},{"id":"D","text":"C3 e C4 plasmatici ridotti","correct":false},{"id":"E","text":"Normali livelli di albuminemia","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2026::aprile","addome::nefro::GNF"],"explanation":null}],"topics":{"nefro::Equilibrio elettrolitico":{"title":"Equilibrio elettrolitico","subject":"nefro","pages":[21,22],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Gli elettroliti sono particelle con carica elettrica sciolte nei liquidi dell’organismo, come sodio e potassio. Il sodio aiuta a regolare la quantità di acqua fuori dalle cellule; il potassio è fondamentale anche per il funzionamento elettrico di cuore e muscoli.","mechanism":"La concentrazione di sodio nel sangue non dipende soltanto da quanto sale assumiamo: dipende soprattutto dal rapporto fra sodio e acqua. L’ADH è un ormone che fa recuperare acqua ai reni. Se è eccessiva, può diluire il sodio e provocare iponatremia.","exam_logic":"Quando una domanda parla di sodio basso, chiediti sempre: il problema è perdita di sodio, eccesso di acqua o entrambi? Non confondere la quantità totale di sodio con la sua concentrazione.","glossary":{"Iponatremia":"Concentrazione di sodio nel sangue inferiore al normale.","ADH":"Ormone antidiuretico: fa riassorbire acqua nei reni, rendendo l’urina più concentrata.","Osmolarità":"Misura di quante particelle disciolte sono presenti in una soluzione."},"editorial_note":""},"nefro::Esame delle urine":{"title":"Esame delle urine","subject":"nefro","pages":[2,3,7,10],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"L’esame delle urine studia ciò che il rene elimina e può dare indizi su filtrazione, infezioni e sanguinamenti. È utile distinguere ciò che viene dal glomerulo (il filtro del rene) da ciò che nasce nelle vie urinarie.","mechanism":"Il glomerulo trattiene normalmente gran parte delle proteine e le cellule del sangue. Se il filtro si danneggia, possono comparire proteine o globuli rossi nelle urine. I globuli rossi che attraversano un filtro lesionato possono cambiare forma.","exam_logic":"Le prove più utili non sono tutte equivalenti: globuli rossi deformati o cilindri eritrocitari orientano verso l’origine glomerulare; bruciore e batteri fanno invece valutare una possibile infezione delle vie urinarie.","glossary":{"Glomerulo":"Piccolo gomitolo di capillari che filtra il sangue all’inizio del nefrone.","Emazie":"Globuli rossi, cellule del sangue che trasportano ossigeno.","Dismorfismo":"Aspetto anomalo della forma di una cellula.","Cilindro eritrocitario":"Stampo microscopico formatosi nei tubuli renali e contenente globuli rossi: suggerisce sanguinamento di origine renale."},"editorial_note":"Attenzione: proteinuria totale e albuminuria non sono sinonimi; le soglie riportate in alcune parti delle dispense sono mescolate. Vedi KDIGO 2024."},"nefro::Iperparatiroidismo secondario":{"title":"Iperparatiroidismo secondario","subject":"nefro","pages":[21,22],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Il paratormone (PTH) è un ormone prodotto dalle paratiroidi che aiuta a regolare calcio e fosforo. Nella malattia renale cronica il rene perde progressivamente parte della capacità di attivare la vitamina D e di eliminare fosforo.","mechanism":"Meno vitamina D attiva significa, in generale, meno calcio assorbito dall’intestino. In più, il fosforo può accumularsi. L’organismo reagisce aumentando il PTH: questo è un iperparatiroidismo secondario, cioè una risposta a un problema esterno alle paratiroidi.","exam_logic":"Non associare automaticamente “stadio 3” a iperparatiroidismo in ogni paziente: è una complicanza frequente e progressiva, ma non universalmente presente. Distingui le tendenze fisiopatologiche dalle affermazioni assolute.","glossary":{"PTH":"Paratormone: ormone che regola il metabolismo di calcio e fosforo.","Calcitriolo":"Forma attiva della vitamina D.","Iperparatiroidismo secondario":"Aumento del PTH dovuto a un problema che altera il bilancio di calcio e fosforo, non a una lesione primaria delle paratiroidi."},"editorial_note":"Alcune domande Anki usano “tutti” o “100%”: richiedono verifica perché gli assoluti sono spesso scorretti."},"nefro::Danno renale acuto":{"title":"Danno renale acuto","subject":"nefro","pages":[14,19],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Il danno renale acuto (AKI, in passato spesso chiamato IRA) è una riduzione rapida della funzione renale. Può manifestarsi con aumento della creatinina nel sangue e/o diminuzione della quantità di urina.","mechanism":"Le cause si dividono in pre-renali (arriva poco sangue al rene), intrinseche o renali (il tessuto renale è danneggiato) e post-renali (l’urina non riesce a defluire). La necrosi tubulare acuta interessa le cellule dei tubuli, molto sensibili alla carenza di ossigeno e ad alcune tossine.","exam_logic":"Per orientarti pensa a dove si trova l’ostacolo: prima del filtro, dentro al rene o dopo il rene. Il fatto che un paziente continui a urinare non esclude da solo un danno renale acuto.","glossary":{"Creatinina":"Sostanza prodotta dai muscoli che il rene elimina; può accumularsi quando la filtrazione si riduce.","Pre-renale":"Causa che riduce l’apporto di sangue al rene senza iniziale lesione strutturale.","Necrosi tubulare":"Danno e morte di cellule dei tubuli renali, spesso dopo ischemia o esposizione a sostanze tossiche.","Ischemia":"Riduzione dell’apporto di sangue e quindi di ossigeno a un tessuto."},"editorial_note":""},"nefro::Malattia renale cronica":{"title":"Malattia renale cronica","subject":"nefro","pages":[19,23],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"La malattia renale cronica (MRC) è un’alterazione della struttura o della funzione renale che persiste per almeno tre mesi e ha conseguenze per la salute. Non basta una creatinina isolata per definirla.","mechanism":"Quando si perdono nefroni (le unità funzionali del rene), quelli rimasti cercano di compensare. Nel tempo possono sovraccaricarsi. Il rene elimina peggio acidi e potassio e produce meno eritropoietina, l’ormone che stimola la formazione di globuli rossi.","exam_logic":"Ricorda la direzione delle alterazioni: tendenza ad acidosi metabolica, aumento del fosforo, anemia e possibili alterazioni del potassio. Si classifica usando causa, eGFR e albuminuria, non soltanto la creatinina.","glossary":{"eGFR":"Stima della quantità di sangue filtrata dai reni ogni minuto, normalizzata alla superficie corporea.","Nefrone":"Unità microscopica del rene che filtra il sangue e modifica il filtrato per produrre urina.","Acidosi metabolica":"Condizione in cui l’organismo accumula acidi o perde basi, riducendo il pH del sangue.","Eritropoietina":"Ormone prodotto soprattutto dal rene che stimola il midollo osseo a produrre globuli rossi."},"editorial_note":"Controllare stadi e albuminuria con la classificazione KDIGO 2024 prima di attribuire valori clinici alle dispense."},"nefro::Trapianto renale":{"title":"Trapianto renale","subject":"nefro","pages":[60,68],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Il trapianto renale sostituisce la funzione di un rene gravemente malato con un organo donato. Il rene trapiantato è spesso collocato nella fossa iliaca, cioè nella parte bassa dell’addome, e collegato ai vasi e alla vescica.","mechanism":"Prima del trapianto bisogna valutare il donatore e il ricevente, soprattutto la compatibilità immunologica. Il sistema immunitario potrebbe riconoscere l’organo come estraneo e attaccarlo: questo fenomeno si chiama rigetto.","exam_logic":"Non tutte le incompatibilità sono assolute in ogni scenario: esistono protocolli particolari e trapianti da donatore vivente, ma comportano decisioni specialistiche. Anche dopo il trapianto possono servire terapie immunosoppressive.","glossary":{"Rigetto":"Risposta immunitaria che danneggia l’organo trapiantato.","Immunosoppressione":"Riduzione intenzionale dell’attività del sistema immunitario tramite farmaci.","ABO":"Sistema dei gruppi sanguigni A, B, AB e 0, rilevante anche nella compatibilità dei trapianti."},"editorial_note":""},"nefro::Dialisi":{"title":"Dialisi","subject":"nefro","pages":[60,63],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"La dialisi è un trattamento che rimuove dal sangue una parte delle sostanze di scarto e dell’acqua che i reni malati non riescono più a eliminare. Non riproduce però tutte le funzioni del rene.","mechanism":"Nell’emodialisi il sangue passa in un filtro esterno. Nella dialisi peritoneale gli scambi avvengono attraverso il peritoneo, la membrana che riveste parte dell’addome. In entrambi i casi le sostanze passano secondo differenze di concentrazione e pressione.","exam_logic":"Distingui la funzione escretrice (eliminazione di acqua e sostanze) da quella endocrina (produzione di ormoni come eritropoietina). Il peso tra una seduta e l’altra è un indizio importante di accumulo di liquidi.","glossary":{"Dialisi peritoneale":"Terapia che usa il peritoneo come membrana di scambio.","Emodialisi":"Terapia che usa una macchina e un filtro per depurare il sangue.","Ultrafiltrazione":"Rimozione di acqua attraverso una membrana grazie a un gradiente di pressione."},"editorial_note":""},"nefro::Glomerulonefriti":{"title":"Glomerulonefriti","subject":"nefro","pages":[24,40],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Le glomerulonefriti sono malattie infiammatorie che colpiscono i glomeruli, i piccoli filtri del rene. Possono causare sangue nelle urine, perdita di proteine, pressione elevata e perdita di funzione renale.","mechanism":"Molte sono causate da processi immunitari: anticorpi e proteine del complemento partecipano a una risposta che, invece di proteggere, danneggia i filtri. La biopsia renale può distinguere forme differenti osservando il tessuto al microscopio.","exam_logic":"Per risolvere i quiz collega: sindrome nefritica = infiammazione con ematuria; sindrome nefrosica = importante perdita di proteine con edemi. ANCA, complemento e immunodepositi aiutano a riconoscere la causa, ma da soli non sostituiscono il quadro clinico.","glossary":{"Complemento":"Insieme di proteine del sangue che amplifica le difese immunitarie e può essere consumato in alcune malattie.","ANCA":"Autoanticorpi contro componenti dei neutrofili, associati ad alcune vasculiti.","Immunocomplesso":"Aggregato formato da un antigene e da anticorpi che lo riconoscono.","Edema":"Accumulo di liquido nei tessuti."},"editorial_note":""},"nefro::Rene policistico":{"title":"Rene policistico","subject":"nefro","pages":[56,59],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"La malattia renale policistica è una patologia, spesso ereditaria, in cui nei reni crescono molte cisti. Una cisti è una cavità piena di liquido, diversa da una massa solida.","mechanism":"Le cisti possono aumentare di numero e dimensione e comprimere il tessuto sano. La forma autosomica dominante dell’adulto può associarsi anche a cisti nel fegato e ad alcune manifestazioni extrarenali.","exam_logic":"Una diagnosi ecografica non significa automaticamente dialisi imminente. Conta la funzione renale nel tempo, la pressione arteriosa e la progressione delle dimensioni renali.","glossary":{"Cisti":"Cavità chiusa contenente liquido o altro materiale.","Autosomico dominante":"Modalità ereditaria nella quale una sola copia alterata di un gene può bastare a provocare la malattia.","Manifestazione extrarenale":"Segno o complicanza presente al di fuori del rene."},"editorial_note":""},"nefro::Pielonefrite":{"title":"Pielonefrite","subject":"nefro","pages":[50,54],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"La pielonefrite è un’infezione che coinvolge il rene, soprattutto il tessuto interstiziale e i tubuli. Spesso i batteri risalgono dalle vie urinarie inferiori.","mechanism":"La combinazione di febbre, brividi e dolore al fianco, accompagnata da globuli bianchi o batteri nelle urine, suggerisce l’interessamento delle alte vie urinarie. Ostruzioni e ristagno di urina aumentano il rischio di complicazioni.","exam_logic":"Attenzione alla differenza fra cistite (infezione della vescica) e pielonefrite (infezione renale): quest’ultima può dare sintomi generali importanti e, nei casi complicati, richiedere valutazione urgente.","glossary":{"Interstizio renale":"Tessuto che si trova fra le strutture funzionanti del rene.","Leucocituria":"Presenza di globuli bianchi nelle urine.","Urocoltura":"Esame che cerca e identifica microrganismi nelle urine."},"editorial_note":""},"nefro::Patologie sistemiche":{"title":"Patologie sistemiche","subject":"nefro","pages":[33,49],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Una malattia sistemica interessa più organi dell’organismo. Il rene può danneggiarsi anche quando la causa principale è altrove, per esempio nel diabete, nelle vasculiti o nel lupus.","mechanism":"Nel diabete, livelli elevati di glucosio nel tempo alterano la microcircolazione renale. In alcune fasi iniziali il filtro può lavorare troppo, cioè iperfiltrare; nelle malattie autoimmuni la risposta immunitaria può danneggiare direttamente i vasi o i glomeruli.","exam_logic":"Quando il quiz descrive segni renali insieme a manifestazioni cutanee, articolari o ematologiche, considera che una singola malattia possa spiegare più organi.","glossary":{"Iperfiltrazione":"Aumento anomalo della filtrazione da parte dei glomeruli, che può precedere il danno progressivo.","Vasculite":"Infiammazione della parete dei vasi sanguigni.","Lupus":"Malattia autoimmune che può coinvolgere diversi organi, tra cui reni e cute."},"editorial_note":""},"nefro::Funzionalità renale":{"title":"Funzionalità renale","subject":"nefro","pages":[2,6],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"La funzione renale si valuta soprattutto stimando la filtrazione glomerulare (GFR), cioè quanta parte del plasma viene filtrata ogni minuto dai reni.","mechanism":"La creatinina è una sostanza prodotta dal metabolismo muscolare ed eliminata prevalentemente dal rene: se la filtrazione cala tende ad aumentare nel sangue. Però dipende anche da massa muscolare, età e altre caratteristiche.","exam_logic":"Ricorda che “creatinina normale” non equivale automaticamente a “rene sano”. Conta il rapporto tra creatinina, filtrato stimato e presenza di danno urinario.","glossary":{"GFR":"Velocità di filtrazione glomerulare: volume di filtrato prodotto in un minuto.","Clearance":"Volume virtuale di plasma depurato da una sostanza in un dato tempo.","Cistatina C":"Proteina del sangue utilizzabile per stimare la funzione renale insieme o al posto della creatinina."},"editorial_note":""},"nefro::Nefropatie vascolari":{"title":"Nefropatie vascolari","subject":"nefro","pages":[41,44],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"I reni ricevono molto sangue, quindi malattie delle arterie o delle arteriole possono danneggiarli. La stenosi dell’arteria renale è un restringimento che riduce l’afflusso di sangue.","mechanism":"Il rene interpreta la ridotta perfusione come una pressione troppo bassa e può attivare il sistema renina-angiotensina-aldosterone, aumentando la pressione arteriosa generale. Nel tempo le lesioni vascolari possono alterare anche i glomeruli.","exam_logic":"Distingui causa e conseguenza: l’ipertensione può danneggiare il rene e un rene con ridotto flusso può contribuire ad aumentare la pressione.","glossary":{"Stenosi":"Restringimento di un vaso o di un canale.","Perfusione":"Quantità di sangue che raggiunge un tessuto.","RAAS":"Sistema ormonale renina-angiotensina-aldosterone che regola pressione e bilancio idrosalino."},"editorial_note":""},"nefro::Biopsia renale":{"title":"Biopsia renale","subject":"nefro","pages":[5,6],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"La biopsia renale consiste nel prelevare un piccolo frammento di tessuto renale per osservarlo al microscopio. Serve quando gli esami del sangue e delle urine non bastano a riconoscere il tipo di malattia.","mechanism":"Si usa spesso una guida ecografica e si valutano le condizioni del paziente perché il rene è ricco di vasi e il rischio principale è il sanguinamento.","exam_logic":"Non confondere il valore diagnostico della biopsia con una sua indicazione automatica: la scelta dipende dal caso clinico e dal rapporto fra benefici e rischi.","glossary":{"Biopsia":"Prelievo di un piccolo campione di tessuto per esame al microscopio.","Controindicazione":"Situazione in cui una procedura potrebbe essere troppo rischiosa o inappropriata."},"editorial_note":""},"nefro::Argomenti misti":{"title":"Argomenti misti","subject":"nefro","pages":[2,68],"source_file":"NEFROLOGIA MARTI.pdf","foundation":"Questa sezione contiene domande appartenenti ad argomenti diversi. Prima di rispondere identifica quale funzione renale è coinvolta: filtrazione, trasporto tubulare, eliminazione dell’urina oppure funzione ormonale.","mechanism":"Collega ogni sintomo alla struttura anatomica che potrebbe generarlo: glomerulo, tubulo, interstizio, vasi o via urinaria.","exam_logic":"Quando non riconosci l’argomento, individua nella domanda i termini decisivi e cerca prima di definire quelli.","glossary":{"Nefrone":"Unità funzionale microscopica del rene.","Diagnosi differenziale":"Confronto tra malattie diverse che possono dare segni o sintomi simili."},"editorial_note":""},"uro::Urologia generale":{"title":"Urologia generale","subject":"uro","pages":[2,7],"source_file":"UROLOGIA MARTI.pdf","foundation":"L’urologia studia le malattie dell’apparato urinario e degli organi genitali maschili, comprese numerose condizioni chirurgiche. Per capire i sintomi bisogna conoscere il percorso dell’urina: rene, pelvi, uretere, vescica e uretra.","mechanism":"Quando il flusso è ostacolato prima o dopo la vescica cambia il quadro clinico. Per esempio, trattenere urina in vescica non è la stessa cosa che non produrla.","exam_logic":"La prima domanda utile è spesso anatomica: dove avviene il problema e quale tratto dell’apparato può provocare quel sintomo?","glossary":{"Uretere":"Condotto che porta l’urina dal rene alla vescica.","Uretra":"Condotto che porta l’urina dalla vescica all’esterno.","Anuria":"Produzione di urina quasi assente; da distinguere dalla ritenzione, in cui l’urina è prodotta ma non esce."},"editorial_note":""},"uro::Infezioni delle vie urinarie":{"title":"Infezioni delle vie urinarie","subject":"uro","pages":[8,16],"source_file":"UROLOGIA MARTI.pdf","foundation":"Le infezioni delle vie urinarie nascono quando microrganismi, spesso batteri, raggiungono e si moltiplicano nell’apparato urinario. La maggior parte risale dall’esterno attraverso l’uretra.","mechanism":"La cistite interessa la vescica e provoca tipicamente bruciore e urgenza urinaria. La pielonefrite interessa il rene e può causare febbre alta, brividi e dolore al fianco. L’urocoltura cerca i batteri e può aiutare a scegliere un antibiotico.","exam_logic":"Conta la sede dell’infezione e se esistono fattori di complicazione come ostruzione, gravidanza o alterato svuotamento. Le terapie e le durate dipendono dal contesto: non applicare automaticamente vecchi schemi delle dispense.","glossary":{"Cistite":"Infezione o infiammazione della vescica.","Pielonefrite":"Infezione del rene.","Urocoltura":"Esame che identifica germi presenti nelle urine.","Disuria":"Difficoltà a urinare; spesso nel linguaggio comune viene usata anche per indicare bruciore urinario."},"editorial_note":"Le indicazioni antibiotiche e le classificazioni vanno confrontate con le linee guida EAU 2026."},"uro::Carcinoma della prostata":{"title":"Carcinoma della prostata","subject":"uro","pages":[21,24],"source_file":"UROLOGIA MARTI.pdf","foundation":"Il carcinoma della prostata è un tumore maligno che origina più spesso dalle cellule ghiandolari prostatiche. È diverso dall’iperplasia prostatica benigna, che non è un tumore maligno.","mechanism":"Il PSA è una proteina prodotta dalla prostata: un valore alto non indica da solo la presenza di cancro. La risonanza magnetica e, quando indicata, la biopsia permettono di approfondire. Il punteggio di Gleason descrive l’aspetto delle cellule tumorali e contribuisce a stimare l’aggressività.","exam_logic":"Non confondere stadiazione (quanto si è esteso il tumore) e grading (quanto le cellule appaiono aggressive). Una terapia radicale mira a eliminare il tumore localizzato, a differenza di un trattamento che controlla una malattia avanzata.","glossary":{"PSA":"Antigene prostatico specifico, proteina prodotta dalla prostata che può essere misurata nel sangue.","Gleason":"Sistema che descrive l’architettura microscopica del carcinoma prostatico.","Biopsia":"Prelievo di tessuto che consente di confermare la diagnosi al microscopio."},"editorial_note":"Le procedure diagnostiche e le soglie nelle vecchie domande vanno confrontate con linee guida EAU aggiornate."},"uro::Calcolosi urinaria":{"title":"Calcolosi urinaria","subject":"uro","pages":[44,50],"source_file":"UROLOGIA MARTI.pdf","foundation":"Un calcolo urinario è un aggregato solido di sali e altre sostanze precipitate dall’urina. Può formarsi nel rene e spostarsi nell’uretere.","mechanism":"La colica renale compare soprattutto quando il calcolo ostruisce l’uretere e aumenta la pressione a monte. Un calcolo presente nel rene senza ostruzione può invece non dare dolore. La composizione dei calcoli condiziona come appaiono agli esami.","exam_logic":"Ragiona su sede, dimensione, presenza di ostruzione e febbre. Febbre con via urinaria ostruita è un segnale di possibile urgenza urologica, non un semplice caso di calcolosi da attendere.","glossary":{"Litiasi":"Formazione di calcoli.","Colica renale":"Dolore intenso spesso intermittente causato dalla distensione delle vie urinarie, frequentemente per ostruzione.","Radiotrasparente":"Poco o non visibile alla radiografia semplice, pur potendo essere identificabile con altri esami.","Urosepsi":"Sepsi la cui origine è un’infezione delle vie urinarie."},"editorial_note":""},"uro::Testicolo":{"title":"Testicolo","subject":"uro","pages":[67,72],"source_file":"UROLOGIA MARTI.pdf","foundation":"Il testicolo produce spermatozoi e testosterone. È collegato al funicolo spermatico, che contiene vasi sanguigni e il dotto deferente.","mechanism":"Nella torsione testicolare il funicolo si attorciglia e ostacola la circolazione: è un’emergenza perché il tessuto rischia di non ricevere ossigeno. L’epididimite è invece un’infiammazione dell’epididimo, struttura dietro al testicolo.","exam_logic":"Davanti a dolore scrotale improvviso, la possibilità di torsione va considerata urgentemente. Un esame ecografico può essere utile, ma non deve ritardare la valutazione chirurgica quando il sospetto clinico è elevato.","glossary":{"Epididimo":"Piccolo condotto ripiegato dietro al testicolo nel quale maturano e vengono conservati gli spermatozoi.","Torsione testicolare":"Rotazione del testicolo e del funicolo che può bloccare il sangue.","Ischemia":"Insufficiente arrivo di sangue a un tessuto."},"editorial_note":""},"uro::Uropatia ostruttiva":{"title":"Uropatia ostruttiva","subject":"uro","pages":[25,30],"source_file":"UROLOGIA MARTI.pdf","foundation":"Si parla di uropatia ostruttiva quando il passaggio dell’urina viene rallentato o bloccato. Un’ostruzione può trovarsi nell’uretere, nella vescica oppure nell’uretra.","mechanism":"Se l’urina si accumula a monte dell’ostacolo, la pelvi e i calici del rene possono dilatarsi: questa dilatazione si chiama idronefrosi. Se sono coinvolti entrambi i reni o un unico rene funzionante, la funzione renale può ridursi rapidamente.","exam_logic":"L’idronefrosi descrive una dilatazione, non necessariamente un’infezione e nemmeno sempre un’ostruzione. L’ecografia guarda la struttura, mentre alcuni esami di medicina nucleare aiutano a capire quanto ogni rene funzioni e scarichi urina.","glossary":{"Idronefrosi":"Dilatazione delle cavità renali che raccolgono urina.","Giunto pieloureterale":"Punto in cui la pelvi renale diventa uretere.","Scintigrafia renale":"Esame che usa una piccola quantità di tracciante radioattivo per valutare funzionamento e drenaggio renale."},"editorial_note":""},"uro::Vescica":{"title":"Vescica","subject":"uro","pages":[4,7,31,43],"source_file":"UROLOGIA MARTI.pdf","foundation":"La vescica conserva temporaneamente l’urina e poi la espelle. Durante il riempimento il muscolo della sua parete, detto detrusore, deve rilassarsi; durante la minzione deve contrarsi.","mechanism":"I sintomi possono derivare da problemi di riempimento (urgenza, frequenza), svuotamento (getto debole, sforzo) o lesioni della parete vescicale. I tumori della vescica possono essere superficiali oppure invadere il muscolo, con conseguenze diverse per il trattamento.","exam_logic":"Distingui “in situ” (cellule tumorali confinate all’epitelio) da “invasivo” (cellule che attraversano gli strati in profondità). Inoltre distingui un difetto di contrazione del detrusore da un ostacolo all’uscita dell’urina.","glossary":{"Detrusore":"Muscolo della parete vescicale che si contrae per svuotare la vescica.","Carcinoma in situ":"Tumore che non ha invaso i tessuti sottostanti.","Urotelio":"Epitelio specializzato che riveste gran parte delle vie urinarie."},"editorial_note":""},"uro::Iperplasia prostatica benigna":{"title":"Iperplasia prostatica benigna","subject":"uro","pages":[17,20],"source_file":"UROLOGIA MARTI.pdf","foundation":"L’iperplasia prostatica benigna è l’aumento del numero di cellule della prostata, frequente con l’età. La prostata circonda il primo tratto dell’uretra maschile: aumentando di volume può ostacolare il passaggio dell’urina.","mechanism":"L’ostacolo comprende una parte “statica” (il tessuto occupa spazio) e una parte “dinamica” (il tono della muscolatura liscia aumenta la resistenza). Il paziente può avere esitazione, getto debole e bisogno di urinare spesso.","exam_logic":"L’IPB non è sinonimo di carcinoma prostatico. I farmaci alfa-litici rilassano la muscolatura e gli inibitori della 5-alfa-reduttasi agiscono sul volume nel tempo.","glossary":{"IPB":"Iperplasia prostatica benigna: crescita non cancerosa delle cellule della prostata.","LUTS":"Sintomi delle basse vie urinarie, come frequenza, urgenza o getto debole.","Alfa-litici":"Farmaci che riducono la contrazione della muscolatura liscia a livello di prostata e collo vescicale."},"editorial_note":""},"uro::Tumori renali":{"title":"Tumori renali","subject":"uro","pages":[51,58],"source_file":"UROLOGIA MARTI.pdf","foundation":"I tumori renali sono masse che possono essere benigne o maligne. Il carcinoma a cellule renali origina dal tessuto renale, non dalla parete della vescica.","mechanism":"Molte masse vengono scoperte casualmente con ecografia o TAC. Alcuni tumori possono produrre sostanze biologicamente attive e causare segni lontani dal rene; si parla di sindromi paraneoplastiche.","exam_logic":"La sede delle metastasi segue spesso il drenaggio venoso e linfatico. Il sangue nelle urine è un sintomo possibile, ma non basta da solo per stabilire una diagnosi.","glossary":{"Carcinoma renale":"Tumore maligno originato dalle cellule del tessuto renale.","Poliglobulia":"Aumento del numero di globuli rossi nel sangue.","Paraneoplastico":"Effetto indiretto di un tumore, non dovuto alla sua invasione locale."},"editorial_note":""},"uro::Infertilità":{"title":"Infertilità","subject":"uro","pages":[59,66],"source_file":"UROLOGIA MARTI.pdf","foundation":"L’infertilità è la difficoltà di ottenere una gravidanza. Nel maschio può dipendere da produzione insufficiente degli spermatozoi, problemi del loro trasporto o alterazioni della funzione sessuale.","mechanism":"L’azoospermia indica che nel liquido seminale non si osservano spermatozoi. Il varicocele è una dilatazione delle vene del funicolo spermatico e può alterare, in alcuni casi, la qualità del liquido seminale.","exam_logic":"Non confondere una causa di infertilità con una causa diretta di disfunzione erettile: sono problemi diversi, anche se talvolta possono coesistere.","glossary":{"Varicocele":"Dilatazione delle vene che drenano il testicolo.","Azoospermia":"Assenza di spermatozoi nell’eiaculato.","Spermiogramma":"Esame che valuta numero, movimento e forma degli spermatozoi."},"editorial_note":""},"uro::Patologie del pene":{"title":"Patologie del pene","subject":"uro","pages":[59,63],"source_file":"UROLOGIA MARTI.pdf","foundation":"Alcune malattie del pene modificano i tessuti necessari all’erezione. Nell’induratio penis plastica, detta anche malattia di Peyronie, si formano placche fibrose nella tonaca albuginea.","mechanism":"La fibrosi significa che un tessuto perde elasticità per accumulo di materiale cicatriziale. Durante l’erezione le parti meno elastiche si distendono meno, causando incurvamento e talvolta dolore o difficoltà erettile.","exam_logic":"Non confondere Peyronie con priapismo: il priapismo è un’erezione persistente e non desiderata, potenzialmente urgente.","glossary":{"Tonaca albuginea":"Rivestimento fibroso dei corpi cavernosi.","Fibrosi":"Accumulo di tessuto cicatriziale che riduce l’elasticità.","Priapismo":"Erezione prolungata indipendente dal desiderio sessuale."},"editorial_note":""},"uro::Incontinenza":{"title":"Incontinenza","subject":"uro","pages":[31,37],"source_file":"UROLOGIA MARTI.pdf","foundation":"L’incontinenza urinaria è una perdita involontaria di urina. Per comprenderla bisogna distinguere la funzione di serbatoio della vescica dal meccanismo che chiude l’uretra.","mechanism":"Nell’incontinenza da sforzo la pressione nell’addome supera la capacità di chiusura dell’uretra, per esempio quando si tossisce. In quella da urgenza il muscolo detrusore si contrae in modo eccessivo o inappropriato.","exam_logic":"Chiediti se la perdita avviene con uno sforzo o dopo un bisogno improvviso e irresistibile di urinare: la distinzione orienta il meccanismo e la terapia.","glossary":{"Continenza":"Capacità di trattenere l’urina fino al momento desiderato.","Detrusore":"Muscolo della parete vescicale.","Incontinenza da urgenza":"Perdita di urina associata a bisogno improvviso e urgente di urinare."},"editorial_note":""},"uro::Ematuria":{"title":"Ematuria","subject":"uro","pages":[5,6,38,40],"source_file":"UROLOGIA MARTI.pdf","foundation":"Ematuria significa presenza di globuli rossi nelle urine. Può essere macroscopica (visibile) oppure microscopica (osservabile con un esame).","mechanism":"Le cause includono infezioni, calcoli, problemi renali e tumori delle vie urinarie. Una colorazione rossa delle urine non è automaticamente sangue: alcuni alimenti e farmaci possono cambiarne il colore.","exam_logic":"Per interpretarla cerca sintomi associati, età, fattori di rischio, presenza di coaguli e segni di origine glomerulare.","glossary":{"Microematuria":"Globuli rossi nelle urine visibili soltanto con esami di laboratorio.","Macroematuria":"Urine visibilmente sanguinolente.","Pseudomaturia":"Colorazione delle urine che simula il sangue ma non è dovuta a globuli rossi."},"editorial_note":""}}};

async function importBackup(file){

  const next={};let count=0;
  for(const [id,item] of Object.entries(d.progress)){
   if(!MAP.has(id)||!item||typeof item!=='object'||Array.isArray(item))continue;
   const attempts=clampInt(item.attempts||0,0,100000),correct=clampInt(item.correct||0,0,attempts);
   const r={attempts,correct,fav:item.fav===true};
   if(['easy','medium','hard'].includes(item.difficulty))r.difficulty=item.difficulty;
   if(['again','hard','good','easy'].includes(item.lastGrade))r.lastGrade=item.lastGrade;
   if(Number.isFinite(item.last)&&item.last>=0)r.last=item.last;
   if(Number.isFinite(item.dueAt)&&item.dueAt>=0)r.dueAt=item.dueAt;
   next[id]=r;count++;
  }
  const set=structuredDefaultSettings(),raw=d.preferences;
  if(raw&&typeof raw==='object'&&!Array.isArray(raw)){
   for(const k of ['showReviewBar','autoAdvanceOnGrade','showExplanations','showOptionReasons','showDifficulty','showProgress','showTimer','keyboardShortcuts','showFavorites','showSkipButton'])if(typeof raw[k]==='boolean')set[k]=raw[k];
   if(['questions','time'].includes(raw.repeatMode))set.repeatMode=raw.repeatMode;
   for(const grade of GRADES){const k=grade.key;if(raw.questionSpacing?.[k]!==undefined)set.questionSpacing[k]=clampInt(raw.questionSpacing[k],1,100);
    if(raw.timeSpacing?.[k]){set.timeSpacing[k].n=clampInt(raw.timeSpacing[k].n,1,365);if(['minutes','hours','days'].includes(raw.timeSpacing[k].unit))set.timeSpacing[k].unit=raw.timeSpacing[k].unit;}}
  }
  progress=next;preferences=set;saveProgress();saveSettings();if(+d.year>=1&&+d.year<=6){state.year=+d.year;try{localStorage.setItem(HOME_YEAR_KEY,String(state.year))}catch{}}
  closeSettings();showModal('Backup importato',`${count} domande con progressi recuperati. Le statistiche sul dispositivo sono state sostituite con quelle del file.`);
 }catch(err){showModal('Backup non importato',err?.message||'Il file non è valido. I tuoi progressi attuali sono rimasti invariati.');}
}

function rateQuestion(key){const s=state.session,q=currentQ();if(!s||s.mode==='mock'||!preferences.showReviewBar||!GRADES.some(g=>g.key===key))return;

function collectTimeDue(){const s=state.session;if(!s||s.mode==='mock'||!s.pendingTimed?.length)return;

function appelloLabel(tag){return String(tag||'').split('::').slice(2).join(' · ').replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase())||tag}
function breadcrumbs(arr){return `<nav aria-label="Percorso" class="breadcrumbs"><button data-action="home">Home</button>${arr.map(x=>`<span>›</span>${x.action?`<button data-action="${escap(x.action)}" ${x.id?`data-id="${escap(x.id)}"`:''}>${escap(x.name)}</button>`:`<span>${escap(x.name)}</span>`}`).join('')}</nav>`}
function container(html){app.innerHTML=`<div class="container">${html}</div>`}
function setPage(page,opts={}){Object.assign(state,opts,{page});if(page!=='player' && state.session && !['results','play'].includes(page)){/* session timer stays only during player */}render();window.scrollTo(0,0)}
function courseCount(id){const c=CATALOG[id];return c?.subject?subjectsFor(c.subject).length:0}
function goYear(id){state.year=+id;try{localStorage.setItem(HOME_YEAR_KEY,String(state.year))}catch{}setPage('year')}
function goCourse(id){state.course=id;state.subject=id;state.filters={topic:'all',appello:'all',search:'',fav:false};state.readPage=0;setPage(CATALOG[id]?.children?'course':'subject')}
function goSubject(id){state.subject=id;state.course=CATALOG[id]?.parent||id;state.filters={topic:'all',appello:'all',search:'',fav:false};state.readPage=0;setPage('subject')}

function qsFiltered(){let a=activeQuestions().slice();const f=state.filters;if(f.topic!=='all')a=a.filter(q=>q.topic===f.topic);if(f.appello!=='all')a=a.filter(q=>(q.appelli||[]).includes(f.appello));if(f.fav)a=a.filter(q=>progress[q.id]?.fav);if(f.search.trim()){const r=f.search.toLocaleLowerCase('it').trim();a=a.filter(q=>[q.question,q.topic,q.options.map(o=>o.text).join(' ')].join(' ').toLocaleLowerCase('it').includes(r))}return a}

function getExpHTML(q,expanded=true){if(!expanded)return '';const t=topicRecord(q);const exp=q.explanation;const src=q.source_comments_text;
return `<div class="explain">${exp?`<h4>Perché la risposta è corretta</h4><p>${escap(exp.correct_reason)}</p>${exp.remember?`<div class="notice">${escap(exp.remember)}</div>`:''}<div class="source-tag">Spiegazione originale redatta per il progetto · bozza didattica, da revisionare</div>`:`<h4>Teoria collegata alla domanda</h4><p>La spiegazione specifica per questa domanda e per ogni alternativa <b>non è ancora completa</b>. Nel frattempo trovi sotto i concetti della lezione corrispondente, per capire il contesto senza inventare motivazioni.</p>`}${q.review_flag?`<div class="notice warning" style="margin-top:12px"><b>${escap(q.review_flag.title)}</b>: ${escap(q.review_flag.why)}</div>`:''}${src?`<div class="notice" style="margin-top:12px"><b>Commento presente nel mazzo Anki:</b> ${escap(src.slice(0,1100))}</div>`:''}${t?`<details ${!exp?'open':''}><summary class="inline-link" style="cursor:pointer;margin-top:14px">Teoria da ${escap(t.source_file)} · ${escap(q.topic)}</summary>${openArticle(t)}</details>`:''}</div>`}
function optionRead(q){if(q.type==='open_answer')return `<div class="q-option correct"><span class="opt-index">${icon("book")}</span><span class="opt-content"><strong>Risposta originale:</strong> ${escap(q.answer)}</span></div>`;

function questionReadCard(q,n){return `<article class="question-card"><div class="q-meta"><span>#${n}</span><span class="chip gray">${escap(q.subject_label)}</span><span>${escap(q.topic)}</span>${q.review_flag?'<span class="chip warn">Risposta da verificare</span>':''}${q.explanation?'<span class="chip">Spiegazione completa</span>':''}</div><div class="card-heading"><h4 class="q-title">${escap(q.question)}</h4><button class="tag-btn" title="Preferiti" aria-label="Aggiungi o togli dai preferiti" aria-pressed="${!!progress[q.id]?.fav}" data-action="favorite" data-id="${escap(q.id)}">${icon(progress[q.id]?.fav?"bookmark-check":"bookmark")}</button></div>${optionRead(q)}${preferences.showExplanations?getExpHTML(q):''}${difficultyControl(q)}<div class="explain-foot">ID originale: ${escap(q.id)} · Risposta del mazzo non verificata clinicamente</div></article>`}

function pickQuestions(){const s=state.setup;let list=activeQuestions().filter(q=>q.type==='multiple_choice'||q.type==='open_answer');if(s.topic!=='all')list=list.filter(q=>q.topic===s.topic);if(s.appello!=='all')list=list.filter(q=>(q.appelli||[]).includes(s.appello));if(s.selection==='due')list=list.filter(q=>progress[q.id]?.dueAt && progress[q.id].dueAt<=Date.now());if(s.selection==='new')list=list.filter(q=>!progress[q.id]?.attempts);if(s.selection==='wrong')list=list.filter(q=>(progress[q.id]?.attempts||0)>(progress[q.id]?.correct||0));if(state.mode==='mock')list=list.filter(q=>q.type==='multiple_choice'&&q.answer_status==='single'&&!q.uncertain_in_source);
 if(state.mode!=='mock')list=list.filter(q=>q.type==='open_answer'||q.correct_indexes?.length>0);
 for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 const n=s.count==='all'?list.length:(s.count==='custom'?Math.max(1,+s.n||1):+s.count);return list.slice(0,n)}
function startSession(){if(state.mode==='official'){showModal('Modalità non ancora disponibile','Per questa modalità servono prima le regole autentiche del tuo esame. Usa la simulazione libera per ora.');return}
 const picked=pickQuestions();if(!picked.length){showModal('Nessun quesito disponibile','Le combinazioni di argomento e appello selezionate non hanno domande utilizzabili.');return}
 const duration=(+state.setup.hours*3600)+(+state.setup.minutes*60)+(+state.setup.seconds);
 if(state.mode==='timed'&&duration===0){showModal('Imposta un tempo','Per l’allenamento a tempo seleziona almeno un secondo.');return}
 if(clockHandle)clearInterval(clockHandle);
 state.session={mode:state.mode,ids:picked.map(q=>q.id),initialIds:picked.map(q=>q.id),cursor:0,responses:{},repeatCounts:{},skipCounts:{},pendingTimed:[],starts:Date.now(),ends:(state.mode==='timed'||state.mode==='mock')&&duration>0?Date.now()+duration*1000:0,seconds:duration,autoSubmitted:false};
 state.results=null;
 if(state.session.ends){clockHandle=setInterval(tickTimer,250)}setPage('player');}
function tickTimer(){if(!state.session)return;let remaining=Math.max(0,Math.ceil((state.session.ends-Date.now())/1000));const el=$('#timer');if(el){el.textContent=formatTime(remaining);el.classList.toggle('low',remaining<=60)}if(remaining<=0){finishSession(true)}}
function formatTime(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),sc=s%60;return `${pad(h)}:${pad(m)}:${pad(sc)}`}
function currentQ(){return MAP.get(state.session?.ids[state.session?.cursor])}
function answerCorrect(q,indexes){return q.correct_indexes?.length===indexes?.length && [...indexes].sort((a,b)=>a-b).every((v,i)=>v===[...q.correct_indexes].sort((a,b)=>a-b)[i])}
function showPlayer(){const s=state.session;if(!s)return showHome();const q=currentQ();if(!q)return showHome();const r=s.responses[s.cursor]||{};const immediate=s.mode!=='mock';const revealed=!!r.revealed&&immediate;const opts=q.options||[];const multiple=q.correct_indexes?.length>1;const isOpen=q.type==='open_answer';const percentage=Math.floor(100*(s.cursor+1)/s.ids.length);const graded=!!r.grade;
 container(`<div class="practice-shell"><div class="player-header"><div class="player-progress">${preferences.showProgress?`<p>${s.mode==='mock'?'SIMULAZIONE · RISULTATI ALLA FINE':s.mode==='timed'?'ALLENAMENTO A TEMPO':'ALLENAMENTO INTERATTIVO'} · ${s.cursor+1} di ${s.ids.length}${s.ids.length>s.initialIds.length?` · ${s.ids.length-s.initialIds.length} ripassi inseriti`:''}</p><div class="progress-meter"><div class="progress-fill" style="width:${percentage}%"></div></div>`:`<p>${s.mode==='mock'?'Simulazione libera':s.mode==='timed'?'Allenamento a tempo':'Allenamento'}</p>`}</div>${s.ends&&preferences.showTimer?`<div id="timer" class="timer">${formatTime(Math.max(0,Math.ceil((s.ends-Date.now())/1000)))}</div>`:''}${btn(icon('settings'),'open-settings','outline settings-gear','aria-label="Impostazioni studio" title="Personalizza lo studio"')}</div>
 <div class="player-card"><div class="q-meta"><span class="chip gray">${escap(q.subject_label)}</span><span>${escap(q.topic)}</span>${immediate&&preferences.showFavorites?`<button class="mini-favorite" data-action="favorite" data-id="${escap(q.id)}" aria-label="${progress[q.id]?.fav?'Rimuovi dai preferiti':'Aggiungi ai preferiti'}" title="Preferiti">${icon(progress[q.id]?.fav?'bookmark-check':'bookmark')}</button>`:''}${!immediate?'':q.review_flag?'<span class="chip warn">Quesito da verificare</span>':''}</div><h2 class="player-title">${escap(q.question)}</h2>
 ${isOpen?`<div class="open-answer"><p class="small muted">Prova a rispondere a mente o ad alta voce prima di svelare la risposta.</p>${r.revealed?`<div><b>Risposta riportata nel mazzo:</b><p>${escap(q.answer)}</p></div>`:btn('Mostra risposta','reveal-open','outline')}</div>`:
 `<div class="answer-options">${opts.map((o,i)=>{const chosen=(r.selected||[]).includes(i);const show=immediate&&revealed;return `<button class="option-select ${chosen?(immediate?'chosen':'exam-picked'):''} ${show&&o.correct?'right':''} ${show&&chosen&&!o.correct?'wrong':''}" data-action="choose" data-index="${i}" type="button" ${(immediate&&revealed)?'disabled':''}><span class="radio">${chosen?icon("check"):""}</span><span><b style="color:#668176;margin-right:6px">${escap(o.id)}.</b>${escap(o.text)}</span></button>`}).join('')}</div>${multiple&&!r.revealed&&immediate?`<p class="small muted">Questa domanda richiede più risposte. Seleziona tutte le alternative corrette e conferma.</p>${btn('Conferma risposte','submit-multiple','secondary')}`:''}`}
 ${revealed&&!isOpen?`<div role="status" aria-live="polite" class="${r.correct?'correct-feedback':'correct-feedback wrong-feedback'}"><strong>${r.correct?'Risposta corretta':'Da ripassare'}</strong>${!r.correct&&q.correct_indexes?.length?`<span>Nel mazzo: ${escap(q.correct_indexes.map(i=>q.options?.[i]?.text||'').join(' · '))}</span>`:''}</div>${preferences.showExplanations&&q.explanation?.correct_reason?`<div class="instant-explain"><strong>Il ragionamento</strong> ${escap(q.explanation.correct_reason)}</div>`:''}${q.review_flag?`<div class="notice warning">${escap(q.review_flag.title)}</div>`:''}`:''}
 ${isOpen&&r.revealed?`${preferences.showExplanations?getExpHTML(q):''}${!preferences.showReviewBar?`<div class="player-actions">${btn('Non la ricordavo','grade-open','outline','data-value="false"')}${btn('La ricordavo','grade-open','secondary','data-value="true"')}</div>`:''}`:''}
 ${immediate&&revealed?difficultyControl(q):''}
 ${immediate&&revealed?ratingBar(r):''}
  ${revealed&&!isOpen&&preferences.showExplanations?`<details class="explain-disclosure"><summary>Spiegazioni, alternative e teoria <span>⌄</span></summary>${optionRead(q)}${getExpHTML(q)}</details>`:''}
 <div class="player-actions">${btn('← Esci','quit-session','outline small-btn')}${immediate&&preferences.showSkipButton&&!r.revealed?btn('Salta','skip-question','outline small-btn'):''}<span class="small muted">${s.mode==='mock'?'Correzioni visibili soltanto alla consegna.':graded?'Ripasso registrato.':''}</span>${s.mode==='mock'?btn(s.cursor===s.ids.length-1?'Consegna esame →':'Prossima →',s.cursor===s.ids.length-1?'submit-exam':'next-question','secondary'):btn(s.cursor===s.ids.length-1?'Termina sessione →':preferences.showReviewBar&&revealed&&!graded?'Continua senza valutare →':'Continua →',s.cursor===s.ids.length-1?'finish-session':'next-question','secondary',(!isOpen&&!revealed)?'disabled':(isOpen&&!r.revealed)?'disabled':(isOpen&&!preferences.showReviewBar&&!r.selfGraded)?'disabled':'')}</div>
 </div><div class="compliance"><b>Fonte risposta:</b> mazzo Anki originale. ${s.mode==='mock'?'Niente spiegazioni né autovalutazione prima della consegna.':preferences.showReviewBar?'La barra di ripasso è facoltativa: puoi disattivarla dalle impostazioni.':'Ripetizione disattivata: dopo aver consultato la risposta, vai avanti.'}</div></div>`)}
function chooseAnswer(index){const s=state.session,q=currentQ();if(!s||!q||q.type==='open_answer')return;let r=s.responses[s.cursor]||{selected:[],revealed:false};if(r.revealed)return;const immediate=s.mode!=='mock',multi=q.correct_indexes.length>1;
 if(multi){r.selected=(r.selected||[]).includes(index)?r.selected.filter(i=>i!==index):[...(r.selected||[]),index];s.responses[s.cursor]=r;if(immediate)render();return}
 r.selected=[index];r.correct=answerCorrect(q,r.selected);r.revealed=immediate;s.responses[s.cursor]=r;if(immediate)addProgress(q.id,r.correct);render()}
function submitMultiple(){const s=state.session,q=currentQ();if(!s||s.mode==='mock')return;let r=s.responses[s.cursor];if(!r?.selected?.length){showModal('Scegli almeno una risposta','Puoi selezionare più alternative prima di confermare.');return}r.correct=answerCorrect(q,r.selected);r.revealed=true;addProgress(q.id,r.correct);render()}
function revealOpen(){const s=state.session,q=currentQ();if(!s||q?.type!=='open_answer'||s.mode==='mock')return;let r=s.responses[s.cursor]||{selected:[]};r.revealed=true;s.responses[s.cursor]=r;render()}
function skipQuestion(){const s=state.session,q=currentQ();if(!s||!q||s.mode==='mock')return;if(s.cursor<s.ids.length-1&&(s.skipCounts[q.id]||0)<1){s.ids.push(q.id);s.skipCounts[q.id]=(s.skipCounts[q.id]||0)+1}nextQuestion()}
function gradeOpen(correct){const s=state.session,q=currentQ();if(!s||s.mode==='mock'||!q)return;let r=s.responses[s.cursor]||{};if(r.selfGraded)return;r.selfGraded=true;r.correct=correct;s.responses[s.cursor]=r;addProgress(q.id,correct);nextQuestion()}
function nextQuestion(){const s=state.session;if(!s)return;collectTimeDue();if(s.cursor<s.ids.length-1){s.cursor++;render();window.scrollTo(0,0)}else finishSession(false)}
function finishSession(auto=false){const s=state.session;if(!s)return;if(clockHandle){clearInterval(clockHandle);clockHandle=null}s.autoSubmitted=auto;
 if(s.mode==='mock')s.initialIds.forEach((id,i)=>{const q=MAP.get(id),r=s.responses[i];if(r?.selected?.length){r.correct=answerCorrect(q,r.selected);addProgress(q.id,r.correct)}});
 const byId={};s.initialIds.forEach(id=>{byId[id]=s.responses[s.ids.indexOf(id)]||null});
 const correct=s.initialIds.filter(id=>byId[id]?.correct).length;const answered=s.initialIds.filter(id=>{const r=byId[id];return r&&(r.selected?.length||r.selfGraded)}).length;
 state.results={ids:s.initialIds.slice(),responses:JSON.parse(JSON.stringify(byId)),correct,answered,total:s.initialIds.length,repeats:s.ids.length-s.initialIds.length,elapsed:Math.round((Date.now()-s.starts)/1000),auto,mode:s.mode};state.session=null;setPage('results')}
function showResults(){const r=state.results;if(!r)return showHome();const percent=Math.round(100*r.correct/r.total);container(`${breadcrumbs([{name:'Risultati'}])}<div class="practice-shell"><div class="page-lead"><span class="eyebrow">${r.auto?'TEMPO SCADUTO · CONSEGNA AUTOMATICA':'SESSIONE COMPLETATA'}</span><h1>${r.mode==='mock'?'Ecco il tuo esame.':'Ecco come è andata.'}</h1><p>Il risultato considera la <b>prima risposta</b> di ciascuna domanda, non i ripassi. La percentuale misura la coincidenza con le soluzioni del mazzo Anki, <b>non</b> un voto ufficiale UniTo.</p></div><div class="scores"><div class="score"><strong>${percent}%</strong><span>Risposte corrette</span></div><div class="score"><strong>${r.correct}/${r.total}</strong><span>Domande iniziali</span></div><div class="score"><strong>${formatTime(r.elapsed)}</strong><span>Tempo utilizzato</span></div></div>${r.repeats?`<p class="small muted">${r.repeats} ripassi aggiunti durante questa sessione.</p>`:''}<div class="alert">${r.mode==='mock'?'Questa era una simulazione personalizzata, non un esame ufficiale. ':''}La banca conserva le risposte originali, alcune discutibili: questo punteggio va interpretato come allenamento, non come valutazione clinica.</div><div class="player-actions">${btn('Torna alla materia','back-subject','outline')}${btn('Nuova sessione','setup','secondary')}${btn('Preferenze','open-settings','outline')}</div><div class="section-spaced"><h3>Rivedi ogni domanda</h3><p class="normal-text">Le soluzioni e, quando disponibili, le motivazioni e la teoria compaiono qui anche per la simulazione.</p><div class="result-review">${r.ids.map((id,i)=>{const q=MAP.get(id),answer=r.responses[id];const ok=!!answer?.correct;const skipped=!answer?.selected?.length&&!answer?.selfGraded;return `<article class="result-card"><div class="q-meta"><span>DOMANDA ${i+1}</span><span class="result-status ${skipped?'skipped':ok?'right':'wrong'}">${skipped?'NON RISPOSTA':ok?'CORRETTA':'ERRATA'}</span><span>${escap(q.topic)}</span></div><h4>${escap(q.question)}</h4>${answer?.selected?.length?`<p><strong>Hai scelto:</strong> ${escap(answer.selected.map(i=>q.options[i]?.text).filter(Boolean).join(' · '))}</p>`:''}${optionRead(q)}${preferences.showExplanations?getExpHTML(q):''}</article>`}).join('')}</div></div></div>`)}
function showLibrary(){container(`${breadcrumbs([{name:'Materie'}])}<div class="page-lead"><h1>Tutte le materie</h1><p>Organizzate per anno di corso.</p></div>${YEARS.map(y=>`<section class="native-section"><div class="section-heading"><h2>${escap(y.label)}</h2><button data-action="year" data-id="${y.id}" class="muted small" style="color:#007aff">Apri ›</button></div><div class="native-list">${y.courses.length?y.courses.map(homeCourseCard).join(''):`<div class="native-empty">Nessuna materia caricata.</div>`}</div></section>`).join('')}`)}
function showAbout(){container(`${breadcrumbs([{name:'Il progetto'}])}<div class="page-lead"><h1>Il progetto</h1><p>Esami Molinette è una piattaforma studentesca indipendente per prepararsi agli esami di Medicina UniTo.</p></div><section class="native-section"><div class="section-heading"><h2>Che cosa puoi fare</h2></div><div class="simple-panel"><p>Puoi leggere le domande con le spiegazioni, allenarti con le flashcard e svolgere simulazioni con correzione solo alla fine.</p><p>Il primo archivio contiene <strong>${BANK.meta.total_questions} schede</strong> di Nefrologia e Urologia; non include tutto l'esame di Addome.</p><p>Le risposte derivano dal mazzo Anki originale. Le spiegazioni specifiche, ancora in lavorazione, sono separate dalla teoria e contrassegnate come bozze non revisionate.</p><p>Per ora i tuoi progressi sono salvati soltanto nel browser. L'app non è un servizio ufficiale dell'Università di Torino.</p></div></section>`)}
function showModal(title,msg){state.modal={title,msg};const prev=$('.modal-shade');if(prev)prev.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-shade" role="dialog" aria-modal="true" aria-label="${escap(title)}"><div class="modal"><h3>${escap(title)}</h3><p>${escap(msg)}</p><div class="modal-actions">${btn('Capito','close-modal','secondary')}</div></div></div>`)}
function confirmQuit(nextAction='back-subject',id=''){state.pendingNav={nextAction,id};document.querySelector('.modal-shade')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-shade" role="dialog" aria-modal="true" aria-label="Conferma uscita"><div class="modal"><h3>Abbandonare la sessione?</h3><p>La prova corrente terminerà senza una valutazione complessiva. Le singole risposte già corrette in allenamento rimarranno salvate su questo dispositivo.</p><div class="modal-actions">${btn('Continua ad allenarti','close-modal','outline')}${btn('Abbandona sessione','confirm-quit','secondary')}</div></div></div>`)}
function render(){if(!app)return;document.title=`Esami Molinette · ${({home:'Preparazione Esami',year:YEARS.find(y=>y.id===state.year)?.label,course:CATALOG[state.course]?.name,subject:CATALOG[state.subject]?.name,read:'Lettura',setup:'Allenamento',player:'Sessione',results:'Risultati',library:'Materie',about:'Il progetto'})[state.page]||'Preparazione Esami'}`;
 if(state.page==='home')showHome();else if(state.page==='library')showLibrary();else if(state.page==='year')showYear();else if(state.page==='course')showCourse();else if(state.page==='subject')showSubject();else if(state.page==='read')showRead();else if(state.page==='setup')showSetup();else if(state.page==='player')showPlayer();else if(state.page==='results')showResults();else if(state.page==='about')showAbout();}
document.addEventListener('click',e=>{if(e.target.classList?.contains('settings-shade')){closeSettings();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='open-settings'){openSettings();return}
 if(a==='close-settings'){closeSettings();return}
 if(a==='reset-settings'){preferences=structuredDefaultSettings();saveSettings();openSettings();return}
 if(a==='export-backup'){exportBackup();return}
 if(a==='import-backup'){document.getElementById('backup-file')?.click();return}
 if(a==='rate'){rateQuestion(b.dataset.grade);return}
 if(a==='difficulty'){const id=b.dataset.id,p=progress[id]||{attempts:0,correct:0,fav:false};p.difficulty=b.dataset.value;progress[id]=p;saveProgress();render();return}
 if(a==='close-modal'){document.querySelector('.modal-shade')?.remove();state.modal=null;state.pendingNav=null;return}
 if(a==='confirm-quit'){const nav=state.pendingNav||{nextAction:'back-subject'};state.pendingNav=null;document.querySelector('.modal-shade')?.remove();if(clockHandle){clearInterval(clockHandle);clockHandle=null}state.session=null;if(nav.nextAction==='home')setPage('home');else if(nav.nextAction==='library')setPage('library');else if(nav.nextAction==='about')setPage('about');else if(nav.nextAction==='year')goYear(nav.id);else if(nav.nextAction==='course')goCourse(nav.id);else if(nav.nextAction==='subject')goSubject(nav.id);else if(nav.nextAction==='direct-addome')goCourse('addome');else setPage('subject');return}
 if(state.session&&state.page==='player'&&['home','library','about','year','course','subject','direct-addome'].includes(a)){confirmQuit(a,b.dataset.id||'');return}
 if(a==='home'){setPage('home');return}if(a==='library'){setPage('library');return}if(a==='about'){setPage('about');return}
 if(a==='home-year'){state.year=+b.dataset.id;try{localStorage.setItem(HOME_YEAR_KEY,String(state.year))}catch{}setPage('home');return}
 if(a==='year'){goYear(b.dataset.id);return}
 if(a==='course'){goCourse(b.dataset.id);return}
 if(a==='subject'){goSubject(b.dataset.id);return}
 if(a==='direct-addome'){goCourse('addome');return}
 if(a==='study-addome'){state.subject='addome';state.filters={topic:'all',appello:'all',search:'',fav:false};state.readPage=0;setPage('read');return}
 if(a==='setup-addome'){state.subject='addome';state.mode='mock';setPage('setup');return}
 if(a==='study'){state.readPage=0;setPage('read');return}
 if(a==='topic'){state.filters={topic:b.dataset.topic,appello:'all',search:'',fav:false};state.readPage=0;setPage('read');return}
 if(a==='appello'){state.filters={topic:'all',appello:b.dataset.id,search:'',fav:false};state.readPage=0;setPage('read');return}
 if(a==='setup'){state.mode='practice';state.setup.topic='all';state.setup.appello='all';setPage('setup');return}
 if(a==='setup-mock'){state.mode='mock';state.setup.topic='all';state.setup.appello='all';setPage('setup');return}
 if(a==='setup-due'){state.mode='practice';state.setup.selection='due';state.setup.count='all';state.setup.topic='all';state.setup.appello='all';setPage('setup');return}
 if(a==='mode'){state.mode=b.dataset.mode;render();return}
 if(a==='start-session'){startSession();return}
 if(a==='reset-filters'){state.filters={topic:'all',appello:'all',search:'',fav:false};state.readPage=0;render();return}
 if(a==='fav-filter'){state.filters.fav=!state.filters.fav;state.readPage=0;render();return}
 if(a==='favorite'){let p=progress[b.dataset.id]||{attempts:0,correct:0,fav:false};p.fav=!p.fav;progress[b.dataset.id]=p;saveProgress();render();return}
 if(a==='prev-read'){state.readPage=Math.max(0,state.readPage-1);render();window.scrollTo(0,0);return}
 if(a==='next-read'){state.readPage++;render();window.scrollTo(0,0);return}
 if(a==='choose'){chooseAnswer(+b.dataset.index);return}
 if(a==='submit-multiple'){submitMultiple();return}
 if(a==='reveal-open'){revealOpen();return}
 if(a==='grade-open'){gradeOpen(b.dataset.value==='true');return}
 if(a==='skip-question'){skipQuestion();return}
 if(a==='next-question'){nextQuestion();return}
 if(a==='finish-session'){finishSession(false);return}
 if(a==='submit-exam'){finishSession(false);return}
 if(a==='quit-session'){confirmQuit();return}
 if(a==='back-subject'){setPage('subject');return}
});
document.addEventListener('change',e=>{if(e.target.id==='backup-file'){importBackup(e.target.files?.[0]);return;}if(updateSetting(e))return;const f=e.target.dataset.filter,s=e.target.dataset.setup;
 if(f){state.filters[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;state.readPage=0;render();return}
 if(s){state.setup[s]=e.target.value;if(s==='count')render();return}
});
let searchTimer=null;document.addEventListener('input',e=>{if(e.target.dataset.setup==='n'){state.setup.n=e.target.value;return}if(e.target.dataset.filter!=='search')return;const v=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.filters.search=v;state.readPage=0;const start=e.target.selectionStart||0;render();const input=$('#search-filter');if(input){input.focus();input.setSelectionRange(start,start)}},230)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(document.querySelector('.settings-shade')){closeSettings();return}if($('.modal-shade')){$('.modal-shade')?.remove();return}}
 if(state.page!=='player'||!preferences.keyboardShortcuts||document.querySelector('.settings-shade'))return;
 if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName)&&document.activeElement?.tagName!=='BODY')return;
 const s=state.session,q=currentQ();if(!s||!q)return;
 const r=s.responses[s.cursor]||{};
 if((e.key==='s'||e.key==='S')&&s.mode!=='mock'&&preferences.showSkipButton&&!r.revealed){skipQuestion();return}
 if(e.key==='Enter'){if(s.mode!=='mock'&&r.revealed)nextQuestion();else if(s.mode==='mock')nextQuestion();return}
 if(e.key>='1'&&e.key<='4'&&s.mode!=='mock'&&r.revealed&&preferences.showReviewBar){rateQuestion(GRADES[+e.key-1].key);return}
 if(e.key>='1'&&e.key<='9'&&q.options?.[+e.key-1]&&!r.revealed)chooseAnswer(+e.key-1)
});
render();
})();
