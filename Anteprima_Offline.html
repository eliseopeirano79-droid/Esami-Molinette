<script>
window.ESAMI_MOLINETTE_BANK={"meta":{"app":"Esami Molinette — Preparazione Esami","institution":"Università degli Studi di Torino","version":"0.4.0","created":"2026-10-21","total_questions":672,"subject_counts":{"nefro":397,"uro":275},"complete_specific_explanations":26,"topic_articles":28,"reviews_pending":646,"original_answer_verified":false,"official_exam_simulation_configured":false,"source_notice":"Materiali didattici forniti dall’utente; dati del mazzo originale non verificati. Progetto non ufficiale UniTo."},"questions":[{"id":"anki-1656581949908","subject":"nefro","subject_label":"Nefrologia","topic":"Equilibrio elettrolitico","type":"multiple_choice","question":"Quale tra le seguenti condizioni cliniche non è causa di iponatremia?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"ipertiroidismo","correct":true},{"id":"B","text":"ipotiroidismo","correct":false},{"id":"C","text":"assunzione di diuretici","correct":false},{"id":"D","text":"ipoaldosteronismo","correct":false},{"id":"E","text":"sindrome da inappropriata secrezione di ADH","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::nefro::elettroliti"],"explanation":{"status":"didactic_draft","correct_reason":"L’ipertiroidismo non è una causa tipica di iponatremia. Il sodio può invece diminuire quando il corpo trattiene troppa acqua o perde sodio. La domanda chiede esplicitamente la condizione che NON provoca il disturbo.","option_reasons":["L’ipertiroidismo significa eccesso di ormoni tiroidei e non è una causa abituale di sodio basso.","Nell’ipotiroidismo grave il rene può eliminare peggio l’acqua libera: il sodio può diluirsi.","Alcuni diuretici, soprattutto tiazidici, fanno perdere sodio attraverso le urine.","L’ipoaldosteronismo riduce il recupero renale del sodio: se ne può perdere troppo.","Nella SIADH viene liberato troppo ADH e si trattiene acqua: la concentrazione di sodio si abbassa."],"remember":"Una parola decide il quiz: **NON**. Iponatremia = sodio basso nel sangue, non necessariamente poco sodio totale.","review_flag":null,"source_topic":"nefro::Equilibrio elettrolitico"}},{"id":"anki-1656582097181","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Nell'esame delle urine quale delle seguenti condizioni sta a favore di una provenienza glomerulare delle emazie riscontrate?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"la caratteristica di macroematuria intermittente","correct":false},{"id":"B","text":"la costanza dell'ematuria in controlli successivi","correct":false},{"id":"C","text":"dismorfismo delle emazie","correct":true},{"id":"D","text":"la presenza di emoglobinuria","correct":false},{"id":"E","text":"la presenza contemporanea di lieve proteinuria ed ematuria","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::nefro::esameurine"],"explanation":{"status":"didactic_draft","correct_reason":"Le emazie (globuli rossi) che attraversano il filtro glomerulare possono deformarsi: perciò il dismorfismo è un indizio importante di origine renale glomerulare.","option_reasons":["Il fatto che il sangue compaia a episodi non indica da solo il punto d’origine.","La persistenza dell’ematuria segnala che va indagata, ma non specifica se il sangue viene dal glomerulo.","Corretto: globuli rossi di forma anomala, in particolare acantociti, fanno sospettare il passaggio attraverso un glomerulo danneggiato.","Emoglobinuria significa emoglobina libera nelle urine: non equivale a globuli rossi interi.","Proteinuria ed ematuria insieme suggeriscono un problema renale, ma un quadro lieve non è specifico quanto il dismorfismo."],"remember":"Il glomerulo è il “colino” che filtra il sangue. Se si danneggia, le emazie attraversandolo si deformano.","review_flag":null,"source_topic":"nefro::Esame delle urine"}},{"id":"anki-1656582203452","subject":"nefro","subject_label":"Nefrologia","topic":"Iperparatiroidismo secondario","type":"multiple_choice","question":"L'iperparatiroidismo secondario è presente:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"solo nei pazienti in emodialisi da oltre 5 anni","correct":false},{"id":"B","text":"in tutti i pz con insuff renale cronica dal terzo stadio in avanti","correct":true},{"id":"C","text":"esclusivamente nei pazienti che sono stati binefrectomizzati","correct":false},{"id":"D","text":"unicamente nei pazienti che hanno cominciato la dialisi prima dei 15 anni","correct":false}],"correct_indexes":[1],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::iperparaII"],"review_flag":{"level":"high","title":"Affermazione assoluta non attendibile","why":"La risposta del mazzo dice “in tutti” i pazienti con malattia renale cronica dal terzo stadio. È una generalizzazione da non insegnare come regola clinica. Verificare PTH e contesto clinico."},"explanation":null},{"id":"anki-1656582312869","subject":"nefro","subject_label":"Nefrologia","topic":"Danno renale acuto","type":"multiple_choice","question":"Qual è oggi la più frequente causa di IRA a tubulo necrosi con diuresi conservata?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"la rabdomiolisi non traumatica","correct":false},{"id":"B","text":"i traumi automobilistici","correct":false},{"id":"C","text":"il danno dei mdc","correct":true},{"id":"D","text":"l'avvelenamento da funghi","correct":false},{"id":"E","text":"la pielonefrite acuta","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::IRA"],"review_flag":{"level":"high","title":"“Più frequente oggi” da contestualizzare","why":"La frequenza delle cause di AKI varia per epoca, popolazione e definizioni. La risposta su mezzi di contrasto non può essere presentata come dato epidemiologico universale attuale."},"explanation":null},{"id":"anki-1656582457028","subject":"nefro","subject_label":"Nefrologia","topic":"Malattia renale cronica","type":"multiple_choice","question":"Quale di queste alterazioni non si riscontra abitualmente nell'IRC avanzata?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"ipocalcemia","correct":false},{"id":"B","text":"iperfosforemia","correct":false},{"id":"C","text":"iperpotassiemia","correct":false},{"id":"D","text":"alcalosi metabolica","correct":true},{"id":"E","text":"anemia","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::nefro::IRC"],"explanation":{"status":"didactic_draft","correct_reason":"Il rene malato tende a eliminare male gli acidi: nell’insufficienza renale avanzata ci si aspetta un’acidosi metabolica, non una alcalosi metabolica abituale.","option_reasons":["L’ipocalcemia è possibile per alterazioni di vitamina D e metabolismo minerale.","L’iperfosforemia è possibile quando il rene elimina meno fosforo.","L’iperpotassiemia può comparire soprattutto nella malattia renale avanzata o con fattori aggiuntivi.","Corretto: alcalosi significa eccesso relativo di basi; il problema tipico del rene insufficiente è invece accumulare acidi.","L’anemia è comune perché il rene produce meno eritropoietina, l’ormone che stimola i globuli rossi."],"remember":"Acidosi = eccesso di acidi; alcalosi = eccesso relativo di basi. È un ottimo quiz per riconoscere la fisiologia.","review_flag":null,"source_topic":"nefro::Malattia renale cronica"}},{"id":"anki-1656582728178","subject":"nefro","subject_label":"Nefrologia","topic":"Trapianto renale","type":"multiple_choice","question":"Un donatore di rene con gruppo sanguigno incompatibile con quello del ricevente (affermazione corretta);","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"può essere utilizzato solo nel trapianto da donatore deceduto ad un ricevente iperimmune","correct":false},{"id":"B","text":"può essere utilizzato senza procedure specifiche nel caso di donatore vivente con un aplotipo in comune con il ricevente","correct":false},{"id":"C","text":"può essere utilizzato solo in caso di doppio trapianto da donatore marginale in condizioni di urgenza","correct":false},{"id":"D","text":"può essere utilizzato in caso di donatore vivente dopo condizionamento immunologico del ricevente","correct":true},{"id":"E","text":"non deve mai essere utilizzato","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"Nel caso di Donatore in vita, l’ incompatibilità AB0 , e in certi casi anche la presenza di anticorpi diretti contro il donatore , non rappresentano una controindicazione come nel trapianto renale da donatore deceduto. La programmabilità della data del trapianto renale permette, in questo caso, l’attivazione di procedure preparatorie quali l’ immunomodulazione o l’inserimento in un programma di cross-over","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::nefro::trapianti"],"explanation":null},{"id":"anki-1656583078798","subject":"nefro","subject_label":"Nefrologia","topic":"Dialisi","type":"multiple_choice","question":"La dialisi peritoneale è controindicata:","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"Nei pazienti di età inferiore a 10 anni","correct":false},{"id":"B","text":"nei pazienti cardiopatici di età superiore ad 85 anni","correct":false},{"id":"C","text":"nei pazienti ritornati in dialisi dopo fallimento del trapianto","correct":false},{"id":"D","text":"in tutti i casi precedenti","correct":false},{"id":"E","text":"in nessuno dei casi precedenti","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::nefro::dialisi"],"explanation":null},{"id":"anki-1656583654767","subject":"uro","subject_label":"Urologia","topic":"Ematuria","type":"multiple_choice","question":"Un uomo di 60 anni viene a visita riferendo un episodio di ematuria asintomatica. Come ti comporti?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"Se l'episodio di ematuria è stato uno solo lo tranquillizzi e non richiedi altri accertamenti","correct":false},{"id":"B","text":"richiedi un'urocoltura nel sospetto di una cistite emorragica","correct":false},{"id":"C","text":"richiedi un'ecografia, citologici urinari e, se questi saranno negativi, una cistoscopia flessibile","correct":true},{"id":"D","text":"richiedi soltanto l'esecuzione di un PSA nel sospetto di un sanguinamento da carcinoma prostatico","correct":false},{"id":"E","text":"nessuna delle precedenti soluzioni è corretta","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::uro::ematuria"],"explanation":null},{"id":"anki-1656583759226","subject":"uro","subject_label":"Urologia","topic":"Infezioni delle vie urinarie","type":"multiple_choice","question":"La pielonefrite acuta:","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"è un'infezione del parenchima renale","correct":false},{"id":"B","text":"è solitamente causata da diffusione di batteri per via ematogena","correct":false},{"id":"C","text":"è solitamente causata da diffusione dei batteri per via ascendente dalla vescica","correct":false},{"id":"D","text":"a+b","correct":false},{"id":"E","text":"a+c","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::uro::IVU"],"review_flag":{"level":"low","title":"Risposta combinata","why":"La risposta originale è a+c: alcuni quiz hanno alternative composte (a+b, a+c). Bisogna conservare fedelmente la struttura originale."},"explanation":null},{"id":"anki-1656583827049","subject":"uro","subject_label":"Urologia","topic":"Carcinoma della prostata","type":"multiple_choice","question":"Quale di queste è una terapia radicale nel tumore prostatico?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"prostatectomia radicale","correct":false},{"id":"B","text":"radioterapia","correct":false},{"id":"C","text":"ormonoterapia","correct":false},{"id":"D","text":"chemioterapia","correct":false},{"id":"E","text":"a+b","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::uro::kprostata"],"explanation":null},{"id":"anki-1656584084098","subject":"uro","subject_label":"Urologia","topic":"Calcolosi urinaria","type":"multiple_choice","question":"Quale affermazione è errata?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"un calcolo renale nella maggior parte dei casi determina una colica renale","correct":true},{"id":"B","text":"un calcolo ureterale di 6 mm può essere espulso spontaneamente","correct":false},{"id":"C","text":"i calcoli urinari si formano a partire da un nucleo di aggregazione nelle cavità renali","correct":false},{"id":"D","text":"un calcolo renale di 1 cm di diametro può essere sottoposto a ESWL","correct":false},{"id":"E","text":"Una urosepsi in atto sostenuta da un calcolo ureterale di solito controindica una litotrissia endoscopica","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::uro::calcoli"],"explanation":null},{"id":"anki-1656584244698","subject":"uro","subject_label":"Urologia","topic":"Testicolo","type":"multiple_choice","question":"Quali delle seguenti patologie entrano in diagnosi differenziale del dolore testicolare acuto?","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"torsione testicolare, epididimite acuta, tumore del testicolo","correct":true},{"id":"B","text":"idrocele, torsione testicolare, epididimite acuta","correct":false},{"id":"C","text":"epididimite acuta, varicolele, tumore testicolo","correct":false},{"id":"D","text":"cisti epididimo, torsione testicolare, trauma","correct":false},{"id":"E","text":"prostatite, varicocele, trauma","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::uro::testicolo"],"explanation":null},{"id":"anki-1656584421001","subject":"uro","subject_label":"Urologia","topic":"Uropatia ostruttiva","type":"multiple_choice","question":"L'idronefrosi:","appelli":["addome::appelli::2022::febbraio_1a"],"answer_status":"single","options":[{"id":"A","text":"è un'infezione del parenchima renale","correct":false},{"id":"B","text":"si accompagna spesso a pielonefrite acuta","correct":false},{"id":"C","text":"è assente nella malattia del giunto pieloureterale","correct":false},{"id":"D","text":"se bilaterale può essere causa di IRA","correct":true},{"id":"E","text":"è sempre causata da calcolosi urinaria","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::uro::uropatiaostruttiva"],"explanation":{"status":"didactic_draft","correct_reason":"Un’idronefrosi bilaterale importante può impedire il normale deflusso delle urine da entrambi i reni e provocare un danno renale acuto post-renale.","option_reasons":["L’idronefrosi è dilatazione delle cavità renali, non di per sé una infezione.","Un’infezione può associarsi, ma non è obbligatoria.","Nella malattia del giunto pieloureterale l’idronefrosi è proprio un reperto caratteristico.","Corretto: l’ostruzione bilaterale può compromettere la filtrazione complessiva.","Non sono soltanto i calcoli a causarla; esistono stenosi, reflussi e altre cause."],"remember":"Post-renale = il problema è nel passaggio dell’urina dopo che il rene l’ha prodotta.","review_flag":null,"source_topic":"uro::Uropatia ostruttiva"}},{"id":"anki-1656584532091","subject":"uro","subject_label":"Urologia","topic":"Testicolo","type":"multiple_choice","question":"Il tumore del testicolo:","appelli":["addome::appelli::2022::febbraio_1a","addome::appelli::2024::febbraio_2"],"answer_status":"single","options":[{"id":"A","text":"metastatizza precocemente ai linfonodi inguinali","correct":false},{"id":"B","text":"colpisce soltanto sotto i 40 anni di età","correct":false},{"id":"C","text":"deve essere diagnosticato mediante agobiopsia percutanea ecoguidata","correct":false},{"id":"D","text":"può originare dalla linea germinale o dalle cellule dell'interstizio","correct":true},{"id":"E","text":"spesso origina in esiti di un trauma testicolare","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"in ordine di frequenza, metastatizza Prima ai LFN addominali: retroperitoneali, retrocrurali, mediastinici, sovraclavicolari e cervicali Poi per via ematica: al polmone (sede più frequente), encefalo e fegato Il coriocarcinoma ha un pattern quasi esclusivamente ematogeno Seminomi e non seminomi: hanno diffusione per via linfatica, in entrambi sono frequenti le MTX polmonari e i non seminomi danno anche MTX al fegato","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1a","addome::appelli::2024::febbraio_2","addome::uro::testicolo"],"explanation":null},{"id":"anki-1656596525897","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Da quali di questi indicatori ci si può orientare quanto beve il nostro paziente con normale funzione renale, durante una visita ambulatoriale?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"peso corporeo","correct":false},{"id":"B","text":"peso specifico urinario","correct":true},{"id":"C","text":"secchezza della cute","correct":false},{"id":"D","text":"numero delle minzioni giornaliere","correct":false},{"id":"E","text":"aumentato senso di sete","correct":false}],"correct_indexes":[1],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656596544410","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"La presenza di una severa ipocomplementemia C3 e C4 deve orientare verso quale di queste patologie renali?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"la nefropatia diabetica","correct":false},{"id":"B","text":"la sindrome di Schonlein-Henoch","correct":false},{"id":"C","text":"l'amiloidosi secondaria","correct":false},{"id":"D","text":"l'amiloidosi primitiva","correct":false},{"id":"E","text":"la crioglobulinemia mista essenziale","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::GNF"],"explanation":null},{"id":"anki-1656596620304","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"La positività per anticorpi ANCA in un paziente con compromissione della funzione renale e sedimento urinario \"attivo\" (numerosi cilindri ematici e granulo-ematici, emazie mal conservate, rari leucociti), deve orientare verso:","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"Nefropatia di Alport","correct":false},{"id":"B","text":"Nefropatia da fenacetina","correct":false},{"id":"C","text":"Glomerulopatia in corso di vasculite","correct":true},{"id":"D","text":"uremia conclamata","correct":false},{"id":"E","text":"GNF acuta","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::GNF"],"explanation":{"status":"didactic_draft","correct_reason":"ANCA sono autoanticorpi associati ad alcune vasculiti, cioè infiammazioni dei vasi sanguigni. Insieme a emazie alterate e cilindri urinari orientano verso una glomerulonefrite correlata a vasculite.","option_reasons":["La sindrome di Alport è una malattia ereditaria del collagene della membrana basale, non tipicamente ANCA-associata.","La nefropatia da fenacetina interessa soprattutto l’interstizio e le papille renali.","Corretto: le vasculiti ANCA-associate possono colpire i piccoli vasi glomerulari e dare un sedimento urinario attivo.","Uremia significa accumulo sistemico di sostanze normalmente eliminate dal rene: descrive una conseguenza, non questa causa.","“Glomerulonefrite acuta” è troppo generico rispetto al quadro specifico con ANCA positivi."],"remember":"Sedimento attivo significa che nelle urine si osservano elementi cellulari che indicano un processo patologico in atto.","review_flag":null,"source_topic":"nefro::Glomerulonefriti"}},{"id":"anki-1656596658570","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Quale di questi esami ritenete possa contribuire ad orientarvi rapidamente se, in un paziente, che è giunto alla vostra casuale osservazione, in apparente benessere, con un riscontro di creatininemia di 4 mg/dl, l'insufficienza renale sia di recente insorgenza oppure configuri un danno cronico preesistente da tempo?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"La clearance creatininica","correct":false},{"id":"B","text":"la scintigrafia renale con valutazione funzionale separata","correct":false},{"id":"C","text":"un'anamnesi di poliuria, nicturia e urine chiare","correct":false},{"id":"D","text":"biopsia renale","correct":false},{"id":"E","text":"esame completo urine","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656596672571","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"Cosa sono gli \"humps\", osservabili nella glomerulonefrite acuta post infettiva?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"depositi di immunocomplessi","correct":true},{"id":"B","text":"conseguenza della proteinuria","correct":false},{"id":"C","text":"materiale proteico espressione di un anormale riassorbimento tubulare","correct":false},{"id":"D","text":"depositi di antigene streptococcico isolato","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::GNF"],"explanation":{"status":"didactic_draft","correct_reason":"Gli “humps” sono depositi subepiteliali di immunocomplessi: aggregati di antigeni e anticorpi che si fermano nel glomerulo dopo alcune infezioni.","option_reasons":["Corretto: sono depositi legati alla risposta immunitaria.","La proteinuria è una conseguenza del filtro danneggiato, non il materiale che forma gli humps.","Un difetto di riassorbimento tubulare riguarda il tubulo, mentre gli humps si osservano nel glomerulo.","Non sono semplicemente antigeni batterici isolati: il concetto caratteristico è il deposito di materiale immunitario."],"remember":"Subepiteliale = posto sotto lo strato di cellule epiteliali del glomerulo.","review_flag":null,"source_topic":"nefro::Glomerulonefriti"}},{"id":"anki-1656596688606","subject":"nefro","subject_label":"Nefrologia","topic":"Trapianto renale","type":"multiple_choice","question":"Quale valore di eGFR è considerato indicato per l'immissione in lista per trapianto renale preventivo?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"inferiore a 30 ml/min","correct":false},{"id":"B","text":"inferiore a 25 ml/min","correct":false},{"id":"C","text":"inferiore a 15 ml/min","correct":true},{"id":"D","text":"inferiore a 5 ml/min","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::trapianti"],"review_flag":{"level":"medium","title":"Soglia trapianto da verificare","why":"Criteri di lista e trapianto pre-emptive dipendono da programma, giurisdizione e valutazione clinica; non fissare una soglia universale da questo solo mazzo."},"explanation":null},{"id":"anki-1656596738176","subject":"nefro","subject_label":"Nefrologia","topic":"Dialisi","type":"multiple_choice","question":"Quale criterio è utilizzato per valutare lo stato di sovraidratazione del paziente in emodialisi cronica ambulatoriale al termine dell'intervallo lungo prima dell'inizio della seduta dialitica?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"l'entità dell'incremento pressorio rispetto ai valori abituali","correct":false},{"id":"B","text":"la valutazione degli edemi periferici","correct":false},{"id":"C","text":"la modificazione del peso corporeo rispetto al peso ideale","correct":true},{"id":"D","text":"l'esecuzione del bilancio idrico","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::nefro::dialisi"],"explanation":null},{"id":"anki-1656596769397","subject":"uro","subject_label":"Urologia","topic":"Vescica","type":"multiple_choice","question":"Quale affermazione sulla neovescica ortotopica è corretta?","appelli":["addome: ttiva","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::uro::kprostata"],"explanation":null},{"id":"anki-1656596804688","subject":"uro","subject_label":"Urologia","topic":"Uropatia ostruttiva","type":"multiple_choice","question":"Nel pianificare il management della malattia del giunto pieloureterale, quale dei seguenti esami è fondamentale?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"ecografia reno-vescicale","correct":false},{"id":"B","text":"pielografia anterograda","correct":false},{"id":"C","text":"pielografia retrograda","correct":false},{"id":"D","text":"scintigrafia renale statica e dinamica","correct":true},{"id":"E","text":"ureteroscopia con biopsia","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::uro::uropatiaostruttiva"],"explanation":null},{"id":"anki-1656596820463","subject":"uro","subject_label":"Urologia","topic":"Testicolo","type":"multiple_choice","question":"Nel sospetto di torsione testicolare acuta:","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"per la diagnosi è essenziale l'ecografia testicolare","correct":false},{"id":"B","text":"il primo approcci è basato sulla terapia antibiotica","correct":false},{"id":"C","text":"la diagnosi di certezza si ottiene solo con intervento esplorativo testicolare","correct":true},{"id":"D","text":"la RMN dirime ogni dubbio diagnostico","correct":false},{"id":"E","text":"terapia anti infiammatoria e vigile attesa sono di prima scelta","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::uro::testicolo"],"explanation":{"status":"didactic_draft","correct_reason":"La torsione testicolare può interrompere il flusso di sangue al testicolo; quando il sospetto clinico è elevato, l’esplorazione chirurgica tempestiva permette di confermare e trattare la condizione.","option_reasons":["L’ecografia Doppler aiuta, ma non è sempre dirimente e non deve ritardare l’intervento in caso di forte sospetto.","Gli antibiotici curano infezioni, non risolvono un funicolo attorcigliato.","Corretto: durante l’esplorazione è possibile vedere la torsione e riportare il testicolo in posizione.","La risonanza non deve sostituire la gestione urgente.","Attendere con soli antinfiammatori espone al rischio di perdita del testicolo."],"remember":"Ischemia = arrivo insufficiente di sangue. In torsione il tempo conta perché senza sangue le cellule muoiono.","review_flag":null,"source_topic":"uro::Testicolo"}},{"id":"anki-1656596836570","subject":"uro","subject_label":"Urologia","topic":"Testicolo","type":"multiple_choice","question":"Qual è l'iter diagnostico terapeutico più corretto dopo riscontro di un nodulo testicolare?","appelli":["addome::appelli::2025::maggio"],"answer_status":"single","options":[{"id":"A","text":"ecografia subito e dopo un mese, poi eventuale orchiectomia con incisione scrotale","correct":false},{"id":"B","text":"ecografia, biopsia ecoguidata, markers preoperatori, exeresi del tumore conservando il testicolo","correct":false},{"id":"C","text":"ecografia e markers preoperatori, orchifuniculectomia; nel postoperatorio TC e markers","correct":true},{"id":"D","text":"ecografia, TC, biopsia ecoguidata, orchifuniculectomia ad istologico su biopsia pervenuto","correct":false},{"id":"E","text":"nessuno di questi approcci è corretto","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2025::maggio","addome::uro::testicolo"],"explanation":null},{"id":"anki-1656596856482","subject":"uro","subject_label":"Urologia","topic":"Vescica","type":"multiple_choice","question":"Quale affermazione sull'ureterocutaneostomia è corretta?","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"è la derivazione urinaria di prima scelta nella maggior parte dei pazienti","correct":false},{"id":"B","text":"è una derivazione urinaria continente","correct":false},{"id":"C","text":"espone al rischio di stenosi ureterali e di infezioni renali","correct":true},{"id":"D","text":"di norma è una soluzione transitoria in attesa di confezionamento di neovescica","correct":false},{"id":"E","text":"espone al rischio di deiescenze intestinali","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::uro::vescica"],"explanation":null},{"id":"anki-1656596874982","subject":"uro","subject_label":"Urologia","topic":"Iperplasia prostatica benigna","type":"multiple_choice","question":"L'ipertrofia prostatica benigna è causa di:","appelli":["addome::appelli::2022::febbraio_1b"],"answer_status":"single","options":[{"id":"A","text":"disuria, mitto ipovalido, esitazione minzionale","correct":true},{"id":"B","text":"deficit erettile, stranguria, disuria","correct":false},{"id":"C","text":"pollachiuria, incontinenza notturna, gocciolamento terminale","correct":false},{"id":"D","text":"rialzo del PSA, incontinenza da sforzo, esitazione minzionale","correct":false},{"id":"E","text":"disuria, pollachiuria, incontinenza da sforzo","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::uro::IPB"],"explanation":{"status":"didactic_draft","correct_reason":"L’IPB, aumentando la resistenza nell’uretra prostatica, provoca soprattutto difficoltà a iniziare la minzione (esitazione), getto debole e sforzo urinario.","option_reasons":["Corretto: disuria, getto debole e esitazione descrivono sintomi ostruttivi tipici.","La disfunzione erettile può coesistere ma non è un segno che deriva necessariamente dall’ostruzione.","Urgenza, frequenza e gocciolamento possono essere associati, ma l’incontinenza notturna non è la triade ostruttiva più caratteristica.","Il PSA può aumentare per diversi motivi e l’incontinenza da sforzo non è una manifestazione primaria classica dell’IPB.","Disuria e frequenza possono comparire, ma l’incontinenza da sforzo è tipicamente legata a difetto sfinterico."],"remember":"Statico = il tessuto comprime; dinamico = il muscolo aumenta la resistenza.","review_flag":null,"source_topic":"uro::Iperplasia prostatica benigna"}},{"id":"anki-1656597405952","subject":"nefro","subject_label":"Nefrologia","topic":"Equilibrio elettrolitico","type":"multiple_choice","question":"La sodiemia nel soggetto normale deve essere tra:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"125-128 mEq/L","correct":false},{"id":"B","text":"68-78 mEq/L","correct":false},{"id":"C","text":"135-142 mEq/L","correct":true},{"id":"D","text":"200-230 mEq/L","correct":false},{"id":"E","text":"620-630 mEq/L","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::elettroliti"],"review_flag":{"level":"low","title":"Intervallo di riferimento incompleto","why":"Nel mazzo è indicato 135–142, ma un riferimento usato comunemente per la sodiemia è circa 135–145 mmol/L."},"explanation":{"status":"didactic_draft","correct_reason":"Il sodio nel sangue, o sodiemia, è normalmente circa 135–145 mmol/L; nel mazzo la fascia selezionata è 135–142 mEq/L, che rientra nella norma ma non la copre interamente.","option_reasons":["125–128 indica iponatremia, cioè sodio troppo basso.","68–78 è incompatibile con una normale sodiemia.","La fascia 135–142 è fisiologica, anche se il valore di riferimento usato comunemente si estende fino a circa 145.","200–230 è una ipernatremia estrema, non un valore normale.","620–630 è del tutto incompatibile con l’intervallo fisiologico."],"remember":"Per il sodio, espresso in mmol/L o mEq/L, l’intervallo pratico di riferimento abituale è 135–145.","review_flag":"Il range del mazzo è più stretto di quello clinico comunemente usato.","source_topic":"nefro::Equilibrio elettrolitico"}},{"id":"anki-1656597417394","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"Quale di queste manifestazioni non è applicabile alle glomerulonefriti?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"sdr.nefritica","correct":false},{"id":"B","text":"s.nefrosica","correct":false},{"id":"C","text":"colica renale","correct":true},{"id":"D","text":"anomalie urinarie isolate","correct":false},{"id":"E","text":"sdr.rapidamente progressiva","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::GNF"],"explanation":null},{"id":"anki-1656597430217","subject":"nefro","subject_label":"Nefrologia","topic":"Trapianto renale","type":"multiple_choice","question":"Chi dei seguenti individui può essere un donatore vivente di rene?","appelli":["addome::appelli::2024::settembre_1","addome::appelli::2025::settembre_2"],"answer_status":"single","options":[{"id":"A","text":"genitore","correct":false},{"id":"B","text":"fratello/sorella","correct":false},{"id":"C","text":"individuo apparentato","correct":false},{"id":"D","text":"non apparentato","correct":false},{"id":"E","text":"tutti, chiunque sia disposto volontariamente e senza controindicazioni","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2024::settembre_1","addome::appelli::2025::settembre_2","addome::nefro::trapianti"],"explanation":null},{"id":"anki-1656597442812","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"Qual è la più frequente causa di sindrome nefrosica nell'anziano?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"amiloidosi 2°","correct":false},{"id":"B","text":"glomerulosclerosi focale","correct":false},{"id":"C","text":"nefroangiosclerosi","correct":false},{"id":"D","text":"GMN membranosa","correct":false},{"id":"E","text":"DM2","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::GNF"],"explanation":null},{"id":"anki-1656597455996","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Nell'esecuzione della clearance creatininica delle 24 ore il paziente nel raccogliere le urine deve:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"escludere la minzione di inizio della raccolta ed includere tutte le successive compresa quella di chiusura della raccolta","correct":true},{"id":"B","text":"includere la minzione di inizio della raccolta ed includere tutte le successive compresa quella di chiusura della raccolta","correct":false},{"id":"C","text":"includere la minzione di inizio della raccolta ed includere tutte le successive esclusa quella di chiusura della raccolta","correct":false},{"id":"D","text":"escludere la minzione di inizio della raccolta ed includere tutte le successive esclusa quella di chiusura della raccolta","correct":false},{"id":"E","text":"utilizzare solo le prime urine del mattino","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656597466206","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"Quale di queste glomerulonefriti non si associa a ipocomplementemia acquisita? (due risposte esatte)","appelli":[],"answer_status":"multiple","options":[{"id":"A","text":"da crioglobulinemia mista","correct":false},{"id":"B","text":"proliferativa diffusa lupica","correct":false},{"id":"C","text":"a lesioni minime","correct":true},{"id":"D","text":"membrano proliferativa","correct":false},{"id":"E","text":"acuta postinfettiva","correct":false},{"id":"F","text":"membranosa idiopatica","correct":true}],"correct_indexes":[2,5],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::GNF"],"explanation":null},{"id":"anki-1656597480839","subject":"nefro","subject_label":"Nefrologia","topic":"Rene policistico","type":"multiple_choice","question":"La malattia renale policistica con quale di queste condizioni è più frequentemente associata?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"calcolosi cistinica","correct":false},{"id":"B","text":"cisti epatiche","correct":false},{"id":"C","text":"diverticolosi colica","correct":false},{"id":"D","text":"cataratta bilaterale","correct":false},{"id":"E","text":"b+c","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::PKD"],"explanation":null},{"id":"anki-1656597495913","subject":"nefro","subject_label":"Nefrologia","topic":"Glomerulonefriti","type":"multiple_choice","question":"La presenza di una proteinuria di 6,5 g/24ore con nel sedimento rari leucociti ed assenza di emazia, in soggetto giovane di 25 anni, altezza 172, peso 74, vi orienta in prima ipotesi verso:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"GMN a lesioni minime","correct":false},{"id":"B","text":"glomerulonefrite post infettiva","correct":false},{"id":"C","text":"glomerulonefrite membranosa iniziale","correct":false},{"id":"D","text":"non autorizza a conclusioni","correct":true},{"id":"E","text":"infezione urinaria","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::GNF"],"explanation":null},{"id":"anki-1656597518865","subject":"nefro","subject_label":"Nefrologia","topic":"Danno renale acuto","type":"multiple_choice","question":"Qual è la più frequente causa di insufficienza renale prerenale?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"ustioni","correct":false},{"id":"B","text":"shock cardiogeno","correct":false},{"id":"C","text":"emolisi","correct":false},{"id":"D","text":"sepsi da gram negativi","correct":false},{"id":"E","text":"disidratazione","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"70-80%","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::IRA"],"explanation":{"status":"didactic_draft","correct_reason":"La disidratazione riduce il volume di sangue circolante. Arriva meno sangue al rene e il filtrato può diminuire: è un tipico meccanismo pre-renale.","option_reasons":["Le ustioni possono sottrarre liquidi al circolo, ma non sono la causa comune proposta come principale nel quiz.","Lo shock cardiogeno riduce la portata del cuore e quindi la perfusione renale; è una causa possibile, non la più comune qui.","L’emolisi è la rottura dei globuli rossi: può danneggiare i tubuli, ma non è la causa classica principale di pre-renalità.","La sepsi può provocare alterazioni emodinamiche e danno renale, ma è un quadro più complesso.","Corretto: con poca acqua in circolo diminuisce la perfusione dei glomeruli e il rene filtra meno."],"remember":"La perfusione è il sangue che raggiunge un organo. Poca perfusione = meno sangue disponibile per filtrare.","review_flag":null,"source_topic":"nefro::Danno renale acuto"}},{"id":"anki-1656597528048","subject":"nefro","subject_label":"Nefrologia","topic":"Danno renale acuto","type":"multiple_choice","question":"Qual è la causa più frequente di insufficienza renale acuta renale propriamente detta?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"glomerulonefrite rapidamente progressiva","correct":false},{"id":"B","text":"pielonefrite acuta","correct":false},{"id":"C","text":"necrosi tubulare acuta","correct":true},{"id":"D","text":"calcolosi bilaterale","correct":false},{"id":"E","text":"sepsi","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::IRA"],"explanation":{"status":"didactic_draft","correct_reason":"La necrosi tubulare acuta è una delle cause più comuni di danno renale acuto intrinseco. “Intrinseco” significa che il danno interessa il rene stesso e non soltanto il sangue che arriva o l’urina che defluisce.","option_reasons":["Una glomerulonefrite rapidamente progressiva danneggia soprattutto i glomeruli, ma non è la forma più comune di danno renale acuto intrinseco.","La pielonefrite è un’infezione del rene, spesso tubulo-interstiziale, ma non la causa più comune in questo quesito.","Corretto: le cellule dei tubuli sono particolarmente sensibili a poca ossigenazione e a sostanze tossiche.","La calcolosi bilaterale ostruente provoca tipicamente un danno post-renale, cioè dopo il filtro.","La sepsi può scatenare un danno renale acuto e contribuire anche alla lesione tubulare, ma qui è indicato il tipo di lesione renale più frequente."],"remember":"Pre-renale = prima del rene; intrinseco = nel rene; post-renale = dopo il rene.","review_flag":null,"source_topic":"nefro::Danno renale acuto"}},{"id":"anki-1656597546405","subject":"uro","subject_label":"Urologia","topic":"Carcinoma della prostata","type":"multiple_choice","question":"La classificazione di Gleason si adotta per:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"il grading del carcinoma renale","correct":false},{"id":"B","text":"lo staging dei tumori vescicali","correct":false},{"id":"C","text":"il grading del carcinoma prostatico","correct":true},{"id":"D","text":"lo staging dei tumori del testicolo","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::kprostata"],"explanation":{"status":"didactic_draft","correct_reason":"Il punteggio di Gleason valuta l’aspetto e la disposizione delle ghiandole tumorali del carcinoma prostatico al microscopio: quindi riguarda il grading, cioè l’aggressività istologica.","option_reasons":["Il carcinoma renale ha sistemi di classificazione istologica diversi.","Lo staging della vescica riguarda quanto il tumore infiltra i vari strati della parete, non il Gleason.","Corretto: Gleason e Grade Group sono impiegati nella valutazione del carcinoma prostatico.","La stadiazione del testicolo usa soprattutto l’estensione della malattia e altri parametri, non il punteggio di Gleason."],"remember":"Grading = “come appare aggressivo”; staging = “dove e quanto si è esteso”.","review_flag":null,"source_topic":"uro::Carcinoma della prostata"}},{"id":"anki-1656597559140","subject":"uro","subject_label":"Urologia","topic":"Urologia generale","type":"multiple_choice","question":"Che cosa vuol dire anuria?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"fuoriuscita di urina dall'ano","correct":false},{"id":"B","text":"impossibilità di svuotare la vescica","correct":false},{"id":"C","text":"mancata formazione di urina","correct":true},{"id":"D","text":"assenza di stimolo alla minzione","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::gen"],"explanation":{"status":"didactic_draft","correct_reason":"In senso fisiologico anuria significa che il rene produce una quantità minima o nulla di urina; non va confusa con ritenzione urinaria, in cui l’urina si forma ma resta bloccata in vescica.","option_reasons":["L’urina che fuoriesce dall’ano suggerirebbe una anomala comunicazione, non anuria.","Non riuscire a svuotare una vescica piena è ritenzione urinaria.","Corretto: la produzione di urina è pressoché assente.","La mancanza dello stimolo può avere altre cause e non definisce la produzione renale."],"remember":"Due parole da non scambiare: anuria = urina quasi non prodotta; ritenzione = urina prodotta ma trattenuta.","review_flag":null,"source_topic":"uro::Urologia generale"}},{"id":"anki-1656597572889","subject":"uro","subject_label":"Urologia","topic":"Carcinoma della prostata","type":"multiple_choice","question":"La fosfatasi acida può essere aumentata nel sangue per:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"carcinoma della prostata","correct":true},{"id":"B","text":"osteomalacia","correct":false},{"id":"C","text":"ittero occlusivo","correct":false},{"id":"D","text":"sarcoidosi","correct":false},{"id":"E","text":"neoplasie vescicali","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::kprostata"],"explanation":null},{"id":"anki-1656597593403","subject":"uro","subject_label":"Urologia","topic":"Urologia generale","type":"multiple_choice","question":"Una fibrosi retroperitoneale può provocare:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"infarto polmonare","correct":false},{"id":"B","text":"stenosi mono/bilaterale degli ureteri","correct":true},{"id":"C","text":"ascite","correct":false},{"id":"D","text":"ileite terminale di Crohn","correct":false},{"id":"E","text":"cistiti emorragiche","correct":false}],"correct_indexes":[1],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::gen"],"explanation":{"status":"didactic_draft","correct_reason":"La fibrosi retroperitoneale è la formazione di tessuto fibroso nella parte posteriore dell’addome. Può avvolgere e stringere uno o entrambi gli ureteri, bloccando il normale passaggio dell’urina.","option_reasons":["Non interessa primariamente il circolo polmonare.","Corretto: una stenosi degli ureteri è una complicanza caratteristica.","L’ascite è liquido libero nell’addome e non il meccanismo tipico.","L’ileite terminale di Crohn è una infiammazione dell’intestino, non la conseguenza caratteristica della fibrosi retroperitoneale.","La cistite emorragica interessa la vescica, non è il risultato tipico di questa compressione."],"remember":"Retroperitoneale = dietro la membrana che riveste gli organi addominali.","review_flag":null,"source_topic":"uro::Urologia generale"}},{"id":"anki-1656597611593","subject":"uro","subject_label":"Urologia","topic":"Tumori renali","type":"multiple_choice","question":"Nel carcinoma a cellule renali si osserva spesso:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"anemia sideropenica","correct":false},{"id":"B","text":"anemia emolitica","correct":false},{"id":"C","text":"anemia da ridotta eritropoiesi","correct":false},{"id":"D","text":"poliglobulia","correct":true},{"id":"E","text":"eosinofilia","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::krene"],"explanation":null},{"id":"anki-1656597621521","subject":"uro","subject_label":"Urologia","topic":"Urologia generale","type":"multiple_choice","question":"Che cos'è l'enuresi?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"perdita involontaria e incosciente delle urine durante il sonno","correct":true},{"id":"B","text":"perdita involontaria delle urine durante il giorno","correct":false},{"id":"C","text":"perdita involontaria delle urine durante il giorno e la notte","correct":false},{"id":"D","text":"incontinenza urinaria dovuta a paralisi motoria del detrusore","correct":false},{"id":"E","text":"stato intersessuale caratterizzato dalla presenza di ovotestis","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::gen"],"explanation":null},{"id":"anki-1656597638991","subject":"uro","subject_label":"Urologia","topic":"Vescica","type":"multiple_choice","question":"Il carcinoma in situ della vescica:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"non esiste se non in associazione con altri tumori vescicali","correct":false},{"id":"B","text":"infiltra soltanto la lamina propria","correct":false},{"id":"C","text":"non infiltra affatto","correct":true},{"id":"D","text":"può infiltrare la muscolare","correct":false},{"id":"E","text":"forma papille e può esserne infiltrato l'asse stromale","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::vescica"],"explanation":{"status":"didactic_draft","correct_reason":"Il carcinoma in situ della vescica è una neoplasia maligna confinata all’epitelio superficiale: non ha ancora invaso i tessuti più profondi.","option_reasons":["Può essere isolato oppure associato ad altre lesioni.","L’invasione della lamina propria definirebbe uno stadio diverso.","Corretto: in situ significa confinato allo strato epiteliale.","Se infiltra il muscolo vescicale non è più in situ.","Il carcinoma in situ è tipicamente una lesione piatta, non una crescita papillare con asse stromale."],"remember":"In situ = “nel proprio posto”: le cellule alterate non hanno superato il limite dell’epitelio.","review_flag":null,"source_topic":"uro::Vescica"}},{"id":"anki-1656597655635","subject":"uro","subject_label":"Urologia","topic":"Vescica","type":"multiple_choice","question":"La vescica urinaria è rivestita da:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"epitelio cilindrico muciparo","correct":false},{"id":"B","text":"epitelio squamocellulare","correct":false},{"id":"C","text":"epitelio cubico","correct":false},{"id":"D","text":"epitelio di transizione","correct":true},{"id":"E","text":"epitelio cilindrico ciliato","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::vescica"],"explanation":null},{"id":"anki-1656597678269","subject":"uro","subject_label":"Urologia","topic":"Infezioni delle vie urinari on":"Un paziente di 85 anni con neoplasia che lo ha notevolmente debilitato (67 kg rispetto ai 74 di due anni fa) deve iniziare una terapia con antibiotico la cui posologia tiene conto del grado di funzionalità renale. Avete la sola creatinina plasmatica, che è 1,6 mg/dl. Qual è il suo filtrato glomerulare?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"85 - 100 ml/min","correct":false},{"id":"B","text":"> 120 ml/min","correct":false},{"id":"C","text":"50 - 60 ml/min","correct":false},{"id":"D","text":"< 40 ml/min","correct":false},{"id":"E","text":"40 - 50 ml/min","correct":false},{"id":"F","text":"< 35 ml/min","correct":true}],"correct_indexes":[5],"answer":"","source_comments_text":"Annotazione originale sull’alternativa F: < 35 ml/min → VFG = (140-età)*peso: (72*CRs)*0,85 (se F) = 21,98","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656598080305","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Un tasso di azotemia al di sopra del normale può essere indice di:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"insufficienza renale acuta prerenale","correct":false},{"id":"B","text":"disidratazione in un paziente con normale funzione renale","correct":false},{"id":"C","text":"intenso catabolismo","correct":false},{"id":"D","text":"esame eseguito non a digiuno","correct":false},{"id":"E","text":"tutti i precedenti","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"#manca","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656598097456","subject":"uro","subject_label":"Urologia","topic":"Infezioni delle vie urinarie","type":"multiple_choice","question":"Qual è tra i seguenti l'esame più probante per formulare diagnosi di infezione delle vie urinarie?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"microalbuminuria","correct":false},{"id":"B","text":"complementuria","correct":false},{"id":"C","text":"urocoltura","correct":true},{"id":"D","text":"emocultura","correct":false},{"id":"E","text":"pH urinario","correct":false},{"id":"F","text":"esame delle urine","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::IVU"],"explanation":{"status":"didactic_draft","correct_reason":"L’urocoltura serve a cercare e identificare batteri nelle urine; è l’esame microbiologico più specifico tra quelli elencati per confermare una batteriuria quando indicato.","option_reasons":["La microalbuminuria studia la perdita di albumina, non i batteri.","La complementuria riguarda proteine immunitarie, non la ricerca diretta dell’agente infettivo.","Corretto: con la coltura i microrganismi possono crescere in laboratorio e, quando opportuno, si studia la sensibilità agli antibiotici.","L’emocoltura cerca batteri nel sangue e ha indicazioni diverse, per esempio nella sepsi.","Il pH delle urine può variare per molti motivi e non basta a diagnosticare una infezione.","L’esame urine può mostrare leucociti o nitriti, ma da solo non identifica sempre il germe."],"remember":"Urocoltura = coltura delle urine. Antibiogramma = prova che aiuta a capire a quali antibiotici è sensibile il batterio.","review_flag":null,"source_topic":"uro::Infezioni delle vie urinarie"}},{"id":"anki-1656598133603","subject":"nefro","subject_label":"Nefrologia","topic":"Equilibrio elettrolitico","type":"multiple_choice","question":"La potassiemia nel soggetto normale deve essere tra:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"125 - 128 mEq/L","correct":false},{"id":"B","text":"7-10mEq/L","correct":false},{"id":"C","text":"135 - 142 mEq/L","correct":false},{"id":"D","text":"3,7 - 5 mEq/L","correct":true},{"id":"E","text":"620 - 630 mg/dl","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::elettroliti"],"explanation":{"status":"didactic_draft","correct_reason":"Il potassio plasmatico è normalmente intorno a 3,5–5,0 mmol/L. Il mazzo sceglie correttamente un intervallo compatibile con questi valori.","option_reasons":["125–128 ricorda valori numerici che si vedono per il sodio, non per il potassio.","7–10 mmol/L sarebbe una iperpotassiemia potenzialmente pericolosa per il cuore.","135–142 è un intervallo tipico del sodio, non del potassio.","3,7–5 mmol/L è compreso nella fascia fisiologica del potassio.","620–630 mg/dL non corrisponde ai normali valori di potassiemia ed è espresso con un’unità inappropriata per questa domanda."],"remember":"Potassio e sodio non sono intercambiabili: il potassio è cruciale per la trasmissione elettrica nelle cellule.","review_flag":null,"source_topic":"nefro::Equilibrio elettrolitico"}},{"id":"anki-1656598146445","subject":"uro","subject_label":"Urologia","topic":"Calcolosi urinaria","type":"multiple_choice","question":"La litiasi cistinica si rileva in corso di:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"iperossaluria","correct":false},{"id":"B","text":"iperuricemia","correct":false},{"id":"C","text":"iperfosfaturia","correct":false},{"id":"D","text":"cistinuria congenita","correct":true},{"id":"E","text":"tutte le precedenti","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::calcoli"],"explanation":{"status":"didactic_draft","correct_reason":"La cistinuria è una condizione ereditaria in cui il rene riassorbe male la cistina, una molecola derivata da aminoacidi; quando si accumula nelle urine può formare calcoli.","option_reasons":["L’iperossaluria favorisce soprattutto calcoli di ossalato, non la litiasi cistinica.","L’iperuricemia si collega al metabolismo dell’acido urico e ad altri problemi.","L’iperfosfaturia riguarda la perdita urinaria di fosfato.","Corretto: la cistinuria congenita aumenta la concentrazione urinaria di cistina e predispone ai suoi cristalli.","Non tutte le condizioni elencate causano calcoli di cistina."],"remember":"“Uria” significa “nelle urine”: cistinuria = cistina nelle urine in quantità patologica.","review_flag":null,"source_topic":"uro::Calcolosi urinaria"}},{"id":"anki-1656598187921","subject":"uro","subject_label":"Urologia","topic":"Uropatia ostruttiva","type":"multiple_choice","question":"Tutti i seguenti fattori sono causa di idronefrosi tranne:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"calcolo ostruente l'uretere juxtavescicale","correct":false},{"id":"B","text":"stenosi congenita dell'uretere","correct":false},{"id":"C","text":"reflusso vescico-ureterale","correct":false},{"id":"D","text":"valvole dell'uretra","correct":false},{"id":"E","text":"glomerulonefrite","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::uropatiaostruttiva"],"explanation":null},{"id":"anki-1656598236162","subject":"nefro","subject_label":"Nefrologia","topic":"Danno renale acuto","type":"multiple_choice","question":"Un paziente si è presentato al PS per avere subito un colpo di frusta nel corso di un lieve tamponamento d’auto. Vengono eseguiti degli esami di routine ed emerge a sorpresa una creatininemia di 4,7 mg/dl. Per orientarvi rapidamente sul tipo di insufficienza renale (di recente insorgenza oppure un danno cro er":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::vescica"],"explanation":null},{"id":"anki-1656601090228","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Per valutare l’apporto proteico assunto dal vostro paziente in insufficienza renale quale di questi parametri è utile:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"Il valore delle proteine totali plasmatiche","correct":false},{"id":"B","text":"Il valore dell’albuminemia plasmatica","correct":false},{"id":"C","text":"Il valore della proteinuria a 24/h","correct":false},{"id":"D","text":"Il valore dell’azoturia / dl","correct":false},{"id":"E","text":"Il valore dell’azoturia/24 ore","correct":true}],"correct_indexes":[4],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656601104220","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Quando si assiste ad un aumento stabile della creatinina di circa 2 mg/dl quale percentuale di massa nefronica complessiva è compromessa?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"Oltre il 25%","correct":false},{"id":"B","text":"Fra il 70% e l’80%","correct":false},{"id":"C","text":"Più del 50%","correct":true},{"id":"D","text":"Circa il 10%","correct":false},{"id":"E","text":"Meno del 10%","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::esameurine"],"explanation":null},{"id":"anki-1656601123506","subject":"nefro","subject_label":"Nefrologia","topic":"Patologie sistemiche","type":"multiple_choice","question":"Quale di questi fattori deve far sospettare un incipiente danno glomerulare in portatore di diabete mellito?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"Un incremento della creatinina plasmatica","correct":false},{"id":"B","text":"Un’aumento della proteinuria 24ore superiore ai 3 gr","correct":false},{"id":"C","text":"Un GFR oltre i limiti superiori dell’intervallo di riferimento","correct":true},{"id":"D","text":"Un ematuria con cilindri ematici ed emazie mal conservate","correct":false},{"id":"E","text":"Aumento del senso della sete","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::patologiesistemiche"],"explanation":{"status":"didactic_draft","correct_reason":"Nelle fasi iniziali della nefropatia diabetica può comparire iperfiltrazione: il glomerulo filtra troppo e nel tempo il sovraccarico può danneggiarlo.","option_reasons":["L’aumento della creatinina è spesso un segno più tardivo di riduzione della filtrazione.","Una proteinuria già superiore a 3 grammi al giorno indica un danno importante, non un indizio iniziale.","Corretto: un filtrato insolitamente alto può precedere il calo della funzione renale.","Ematuria con cilindri ematici fa pensare soprattutto a una glomerulonefrite infiammatoria.","La sete aumentata può dipendere dall’iperglicemia ma non identifica specificamente un danno glomerulare iniziale."],"remember":"Iperfiltrazione = il filtro lavora più del normale. Lavorare di più non significa essere più sano.","review_flag":null,"source_topic":"nefro::Patologie sistemiche"}},{"id":"anki-1656601139080","subject":"nefro","subject_label":"Nefrologia","topic":"Pielonefrite","type":"multiple_choice","question":"Quali di questi fattori deve essere considerato un fattore di rischio per lo sviluppo della pielone ,"text":"Dolore alla minzione","correct":false},{"id":"D","text":"Presenza di sangue nelle urine","correct":false},{"id":"E","text":"Emissione di sabbia litiasica","correct":false}],"correct_indexes":[1],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2023::settembre_1","addome::uro::gen"],"explanation":null},{"id":"anki-1656601332212","subject":"uro","subject_label":"Urologia","topic":"Carcinoma della prostata","type":"multiple_choice","question":"La stratificazione di rischio del carcinoma prostatico:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"È una classificazione clinico-anamnestica che permette di decidere se effettuare una biopsia prostatica","correct":false},{"id":"B","text":"Dipende dall’età del paziente, dal Gleason Score e dalle dimensioni della prostata","correct":false},{"id":"C","text":"Dipende dal PSA preoperatorio, dal Gleason score e dalla stadiazione clinica","correct":true},{"id":"D","text":"Dipende dall’età del paziente , dal PSA dopo la prostatectomia e dallo stato dei margini","correct":false},{"id":"E","text":"È utile per decidere se trattare il paziente con una TURP","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::kprostata"],"explanation":null},{"id":"anki-1656601367222","subject":"uro","subject_label":"Urologia","topic":"Testicolo","type":"multiple_choice","question":"Qual è l’iter diagnostico terapeutico più corretto dopo riscontro di un nodulo testicolare?","appelli":["addome::appelli::2022::febbraio_1b","addome::appelli::2023::aprile","addome::appelli::2023::giugno","addome::appelli::2024::dicembre","addome::appelli::2024::febbraio_1"],"answer_status":"single","options":[{"id":"A","text":"Ecografia subito e dopo 1 mese , poi eventualmente orchiectomia con incisione scrotale","correct":false},{"id":"B","text":"Ecografia, biopsia ecoguidata, markers preoperatori, exeresi del tumore conservando il testicolo","correct":false},{"id":"C","text":"Ecografia e markers preoperatori, orchifunilectomia, nel post operatorio TAC e markers","correct":true},{"id":"D","text":"Ecografia, TAC, biopsia ecoguidata, orchifunilectomia ad istologico su biopsia pervenuto","correct":false},{"id":"E","text":"Nessuno dei precedenti approcci è corretto","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2022::febbraio_1b","addome::appelli::2023::aprile","addome::appelli::2023::giugno","addome::appelli::2024::dicembre","addome::appelli::2024::febbraio_1","addome::uro::testicolo"],"explanation":null},{"id":"anki-1656601394639","subject":"uro","subject_label":"Urologia","topic":"Patologie del pene","type":"multiple_choice","question":"L’induratio penis plastica:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"È un sinonimo di erezione rigida","correct":false},{"id":"B","text":"È una patologia caratterizzata da erezione lunga e dolorosa","correct":false},{"id":"C","text":"Può comportare disfunzione erettile","correct":true},{"id":"D","text":"È sempre conseguenza di traumi coitali con rottura del corpo cavernoso","correct":false},{"id":"E","text":"Nessuna delle precedenti è corretta","correct":false}],"correct_indexes":[2],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::pene"],"explanation":{"status":"didactic_draft","correct_reason":"Nella malattia di Peyronie (induratio penis plastica) compaiono placche fibrose che modificano l’elasticità del pene: questo può rendere più difficile l’erezione o il rapporto.","option_reasons":["Non è il nome di una normale erezione rigida.","Un’erezione molto prolungata e dolorosa indipendente dal desiderio si chiama priapismo.","Corretto: incurvamento, dolore o alterazioni del tessuto possono associarsi a disfunzione erettile.","Non è sempre conseguenza di una rottura traumatica evidente del corpo cavernoso.","È falsa perché la terza opzione è corretta."],"remember":"Fibrosi = tessuto cicatriziale più rigido. La perdita di elasticità spiega l’incurvamento.","review_flag":null,"source_topic":"uro::Patologie del pene"}},{"id":"anki-1656601425205","subject":"nefro","subject_label":"Nefrologia","topic":"Malattia renale cronica","type":"multiple_choice","question":"Per verificare l’apporto proteico giornaliero del vostro paziente in insufficienza renale cronica al quale avete prescritto una dieta appropriata al GFR, quale di questi esami ritenete utile?","appelli":["addome::appelli::2024::settembre_1","addome::appelli::2025::settembre_2"],"answer_status":"single","options":[{"id":"A","text":"Dosaggio delle proteine totali","correct":false},{"id":"B","text":"Livello di albuminemia","correct":false},{"id":"C","text":"Clearance creatininica","correct":false},{"id":"D","text":"Azoturia delle 24h","correct":true},{"id":"E","text":"Proteinuria 24h","correct":false}],"correct_indexes":[3],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::appelli::2024::settembre_1","addome::appelli::2025::settembre_2","addome::nefro::IRC"],"explanation":null},{"id":"anki-1656601433735","subject":"nefro","subject_label":"Nefrologia","topic":"Esame delle urine","type":"multiple_choice","question":"Quali di questi algoritmi corrisponde alla formula di Cockroft-Gault di un individuo maschio di 70 anni del peso di 78 kg?","appelli":[],"answer_status":"single","options":[{"id":"A","text":"(140-età) x peso/creatininemia x 72","correct": urce_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::nefro::dialisi"],"explanation":{"status":"didactic_draft","correct_reason":"La dialisi sostituisce una parte del lavoro di eliminazione del rene, ma non riproduce tutte le funzioni che un rene sano svolge continuamente.","option_reasons":["La dialisi non corregge automaticamente tutti i problemi dell’uremia, come i deficit ormonali.","Neppure la funzione escretrice viene riprodotta integralmente e in modo continuo come nel rene sano.","Corretto: dialisi significa depurazione parziale di scorie e acqua, non sostituzione completa dell’organo.","Le funzioni endocrine, come la produzione di eritropoietina, non sono sostituite completamente dal filtro dialitico.","La dialisi non serve principalmente a produrre gli ormoni renali."],"remember":"Escretrice = eliminazione; endocrina = produzione di ormoni. La dialisi aiuta la prima ma non rimpiazza totalmente la seconda.","review_flag":null,"source_topic":"nefro::Dialisi"}},{"id":"anki-1656602649370","subject":"uro","subject_label":"Urologia","topic":"Vescica","type":"multiple_choice","question":"Il carcinoma in situ della vescica:","appelli":[],"answer_status":"single","options":[{"id":"A","text":"È sempre di alto grado","correct":true},{"id":"B","text":"Non esiste, se non in associazione con altri tumori vescicali","correct":false},{"id":"C","text":"Infiltra soltanto la lamina propria","correct":false},{"id":"D","text":"Può infiltrare la muscolare","correct":false},{"id":"E","text":"Forma papille e può essere infiltrato l’asse stromale","correct":false}],"correct_indexes":[0],"answer":"","source_comments_text":"","source_validation":"risposte importate dal mazzo originale, non verificate clinicamente","uncertain_in_source":false,"tags":["addome::uro::vescica"],"explanation":null},{"id":"anki-1656602674121","subject":"uro","subject_label":"Urologia","topic":"Carcinoma
